# WS2812B status LED with breathing effect (AQI-to-colour mapping TBD)
light:
  - platform: neopixelbus
    type: GRB
    variant: WS2812
    pin: GPIO8
    num_leds: 1
    name: "Status LED"
    effects:
      - pulse:
          name: "Breathing"
          transition_length: 2s
          update_interval: 2s

# Bluetooth proxy — extends BLE range for the rest of Home Assistant
bluetooth_proxy:
  active: true

esp32_ble_tracker:

