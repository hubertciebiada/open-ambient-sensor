# =============================================================================
# OAS — Open Ambient Sensor
# Top-level ESPHome configuration
# =============================================================================
#
# Project home: https://github.com/HubertCiebiada/open-ambient-sensor
#
# DIY multi-sensor environmental monitor for indoor spaces. Measures air
# quality (CO2, PM1/2.5/4/10, VOC, NOx, temperature, humidity via Sensirion
# SEN66) and presence (HiLink LD2410 mmWave radar). RGB status ring + dynamic
# NFC tag + Bluetooth proxy. 24V DC powered, mounts on a standard
# wall-recessed electrical box.
#
# ---------------------------------------------------------------------------
# Per-device overrides
# ---------------------------------------------------------------------------
#
# Every physical OAS unit needs its own short identifier ("device_id"), a
# human-friendly room name ("friendly_name"), and optionally a dashboard URL
# that the NFC tag will redirect a phone to. Override these per-device in
# one of two ways:
#
#   1. Copy this file (e.g. `firmware/esphome/devices/livingroom.yaml`) and
#      set `substitutions:` at the top of the copy. Then run:
#        esphome run firmware/esphome/devices/livingroom.yaml
#
#   2. Use the ESPHome dashboard (Home Assistant add-on or standalone) which
#      lets you set substitutions in the per-device config UI.
#
# The substitutions below are the DEFAULTS — they let you flash a single
# unit and verify everything works before deploying a fleet. Override at
# least `device_id` and `friendly_name` for every real device so units
# don't collide on the LAN.
#
# Substitutions you'll typically override per device:
#   device_id      — short slug, lowercase + dashes, e.g. "livingroom".
#                    Becomes the device hostname (oas-livingroom.local) and
#                    the WiFi AP fallback SSID.
#   friendly_name  — display name shown in Home Assistant, e.g. "Living Room".
#   dashboard_url  — URL the NFC tag redirects to when tapped with a phone.
#                    Typically your Home Assistant lovelace dashboard for
#                    that room.
#
# ---------------------------------------------------------------------------
# First-time setup
# ---------------------------------------------------------------------------
#
#   1. Install ESPHome:  pip install esphome
#   2. Copy secrets.yaml.example -> secrets.yaml (gitignored). Fill in WiFi
#      credentials, generate an api_encryption_key, set ota/ap passwords.
#   3. Connect device via either USB-C port (both onboard ports work).
#   4. esphome run firmware/esphome/oas.yaml
#   5. After first boot, open http://oas-<device_id>.local/ for the
#      built-in web dashboard.
#
# Subsequent updates are over-the-air via Home Assistant (preferred) or
# `esphome run` from any machine on the same LAN.
# =============================================================================

substitutions:
  # Per-device identity — override for every physical unit.
  device_id: prototype
  friendly_name: "OAS Prototype"

  # NFC tag redirects to this URL when tapped with a phone. Point this at
  # your Home Assistant lovelace dashboard, a Grafana panel, or any
  # web page that shows the live readings for this device.
  dashboard_url: "https://homeassistant.local/"

  # Project metadata — keep these in sync with CLAUDE.md / boardgen/_project.py.
  project_name: "HubertCiebiada.open-ambient-sensor"
  project_version: "v0.40"

esphome:
  name: oas-${device_id}
  friendly_name: ${friendly_name}
  comment: "Open Ambient Sensor — air quality + presence"
  project:
    name: ${project_name}
    version: ${project_version}

esp32:
  # ESP32-C6-DevKitM-1-N4: Espressif official devkit, ESP32-C6-MINI-1 SoM,
  # 4 MB flash. Two USB-C ports (one via USB-UART bridge, one native USB-
  # Serial-JTAG). EAN 5904422385651. See CLAUDE.md hard constraint #6.
  board: esp32-c6-devkitm-1
  variant: esp32c6
  framework:
    # esp-idf required for BLE proxy memory headroom on 4 MB flash devices.
    # arduino framework runs out of IRAM on C6 + BLE + WiFi + sensors.
    type: esp-idf

# ---------------------------------------------------------------------------
# Packages — split by function. Each package is self-contained and may be
# enabled/disabled per build by commenting it out below.
# ---------------------------------------------------------------------------
packages:
  core:        !include packages/core.yaml
  leds:        !include packages/leds.yaml
  buttons:     !include packages/buttons.yaml
  air_quality: !include packages/air-quality.yaml
  presence:    !include packages/presence.yaml
  nfc:         !include packages/nfc.yaml
  bt_proxy:    !include packages/bt-proxy.yaml
