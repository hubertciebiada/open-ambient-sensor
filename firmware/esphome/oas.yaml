# OAS — Open Ambient Sensor
# Base ESPHome configuration. PRELIMINARY DRAFT — not validated against real hardware.
#
# Pinout and component selections follow CLAUDE.md (v0.4 ESP32-C6-DevKitM-1-N4).
# Strap pins (GPIO 4/5/9/15) and SiP-flash-reserved pins (GPIO 10/11) are already
# avoided — see docs/ARCHITECTURE.md for the canonical pinout.

substitutions:
  device_name: oas-living-room
  friendly_name: "OAS Living Room"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  comment: "Open Ambient Sensor — air quality and presence"

esp32:
  board: esp32-c6-devkitc-1
  framework:
    type: esp-idf

# Logging
logger:
  level: INFO

# Home Assistant native API
api:
  encryption:
    key: !secret api_encryption_key

# OTA
ota:
  - platform: esphome
    password: !secret ota_password

# WiFi
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${device_name} Fallback"
    password: !secret ap_password

captive_portal:

# I²C bus shared between SEN66 (0x6B), NT3H2211 (0x55), plus Qwiic expansion
i2c:
  sda: GPIO6
  scl: GPIO7
  frequency: 100kHz
  scan: true

# UART for HiLink LD2410 presence radar
uart:
  id: ld2410_uart
  tx_pin: GPIO16
  rx_pin: GPIO17
  baud_rate: 256000
  parity: NONE
  stop_bits: 1

