# ---------------------------------------------------------------------------
# OAS LED ring controller — 7 x SK6812-SIDE side-emit RGB
# ---------------------------------------------------------------------------
# Hardware: 7 LEDs (D11..D18, D13 SKIPPED for the J1 24 V terminal block)
# on a Ø26 mm base pitch ring around the central cable hole. Side-emit toward
# the AK-N-94 perforated white ABS cover -> diffuse halo, no "dot-through-
# perforation" pattern.
#
# Bus     : 1-wire WS281x family, GPIO 8 (ESP32-C6 RMT peripheral)
# Variant : SK6812 (NOT WS2812 — different bit-timing; rgb_order GRB)
# Rail    : +5 V from LM2596S-5.0 buck
# Power   : SK6812 SIDE-A = 5 mA per channel, so 7 x 15 mA = 105 mA at full
#           white (brightness 10, Dot Chase) and 35-70 mA for the AQI colours
#           at brightness 10 (POWER_BUDGET in hardware/kicad/boardgen/_project.py).
#
# ---------------------------------------------------------------------------
# Settings — the "LED ring" card of the web dashboard, in this order
# ---------------------------------------------------------------------------
#   1. Ring                   on / off
#   2. Ring Mode              AQI Breathing / AQI Solid / Dot Chase
#   3. Ring Brightness        1..10 — the LEDs' full range in ten even steps
#   4. Ring Night Mode        on / off — dim the ring inside the night window
#   5. Ring Night Brightness  0..Ring Brightness (0 = off for the night; a
#                             value above Ring Brightness snaps back to it)
#   6. Ring Night Start / End the night window, 22:00 -> 07:00 by default
#                             (may wrap midnight; start = end = no night)
#      Ring Status            what the ring is doing now, and until when
#
# Home Assistant gets the same seven controls (1-6), all under the device's
# Configuration card; Ring Status stays on the dashboard only (it is
# `internal`, shown there through `include_internal` in core.yaml's
# web_server). The light entity itself is internal and disabled-by-default:
# its own 0-255 slider and colour picker never reach Home Assistant and sit
# behind the dashboard's "Show All" button, and the schedule tick at the
# bottom of this file is the only thing that drives it (it undoes any change
# made there within a second). Automations switch the ring with
# `switch.<device>_ring`.
#
# Brightness steps: the LEDs are 8-bit behind ESPHome's gamma-2.8 table, so
# the raw 0-255 scale is mostly unusable — its bottom ~16 % is one and the
# same dimmest LED step, and each further slider step is a different size.
# The ten levels are LED output 1, 2, 3, 5, 10, 19, 36, 69, 133, 255 (of 255)
# on the brightest channel: each about 1.9x the one below, from the dimmest
# glow the LEDs can make to full power. Level 4, the default, is exactly the
# old slider's 25 % (light brightness 64/255) — the ring setting of the
# reference unit when the SEN66 temperature offset was calibrated. Heat: at level
# 10 the ring dissipates ~0.2-0.35 W (AQI colours) / ~0.5 W (white) next to
# the SEN66, which warms its temperature reading — the temperature offset in
# air-quality.yaml was calibrated with the ring at level 4.
#
# Critical air quality (`oas_air_quality_critical` in air-quality.yaml: AQI >
# 200 or CO2 > 1500 ppm): a ring that is on turns solid red — at least level
# 7 by day, the night brightness at night (so it never lights up a sleeping
# room; night brightness 0 keeps it off). Ring Mode comes back when the alert
# clears.
#
# Cross-package contract:
#   - packages/air-quality.yaml owns `oas_aqi_value` (template sensor, float)
#     and `oas_air_quality_critical`. DO NOT redeclare either here.
#   - packages/core.yaml owns `ha_time` (the schedule's clock).
#   - This package owns `oas_ring` (the light) and every ring setting above.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Globals
# ---------------------------------------------------------------------------
globals:
  # Colour of the current AQI, refreshed by the interval below and shared by
  # both AQI effects (one band table instead of one per effect).
  - id: oas_aqi_rgb
    type: Color
    restore_value: no
    initial_value: 'Color(0, 255, 0)'

  # Set by on_boot once every entity is restored; before that the settings'
  # on_value / on_state (fired by their own restore) must not count as a
  # change.
  - id: oas_ring_ready
    type: bool
    restore_value: no
    initial_value: 'false'

  # A setting changed since the last tick -> apply it with a short fade.
  - id: oas_ring_changed
    type: bool
    restore_value: no
    initial_value: 'false'

  # Inside the night window at the last clock reading: -1 unknown, 0 no,
  # 1 yes. Kept across reboots so that until the clock syncs (~10-20 s after
  # boot) the ring uses the last known answer — a unit restarted at 03:00
  # comes up at the night brightness, not the day one.
  - id: oas_ring_period
    type: int
    restore_value: yes
    initial_value: '-1'

# ---------------------------------------------------------------------------
# Boot: the schedule starts once every entity has been restored
# ---------------------------------------------------------------------------
# on_boot is a LIST on purpose — air-quality.yaml and presence.yaml add their
# own hooks, and ESPHome's package merge only concatenates lists.
esphome:
  on_boot:
    - priority: -100
      then:
        - lambda: 'id(oas_ring_ready) = true;'

# ---------------------------------------------------------------------------
# Light platform — the ring itself (internal, driven by the schedule tick)
# ---------------------------------------------------------------------------
light:
  - platform: esp32_rmt_led_strip
    chipset: SK6812
    rgb_order: GRB
    num_leds: 7
    pin: GPIO8
    rmt_symbols: 64
    id: oas_ring
    name: "Ring Light"
    internal: true
    # Internal entities show on the dashboard (core.yaml include_internal);
    # this keeps the light's raw controls behind "Show All" there.
    disabled_by_default: true
    # Nothing to restore: the settings below are what persist, and the first
    # schedule tick (~1 s after boot) switches the ring on from them.
    restore_mode: ALWAYS_OFF
    default_transition_length: 500ms
    effects:
      # ---------------------------------------------------------------
      # AQI Breathing — the AQI colour swelling over ~4 s.
      # ---------------------------------------------------------------
      # The ring runs at a few LED steps (level 4 peaks at 5 of 255), so a
      # breath computed as colour x envelope and left to the gamma table
      # comes out as a handful of visible jumps and then sits on the
      # dimmest step for most of its lower half — the start of each swell
      # looks late. This effect computes the final LED values itself:
      #   1. peak = the colour's strongest channel through the light's own
      #      pipeline (gamma, current brightness) — as bright as AQI Solid;
      #   2. envelope = a raised cosine in PERCEIVED brightness (even-looking
      #      swell), mapped to LED output with the same 2.8 gamma, bottoming
      #      out at 20 % of the peak output and never below one LED step. At
      #      level 1 (the usual night level) the peak is that one step, so
      #      the ring holds steady instead of blinking;
      #   3. spatial dithering of that channel: one diffuser over 7 LEDs, so
      #      the ring can show 1/7 of an LED step by giving some LEDs one
      #      step more — 7x finer steps. Extras go to every 3rd LED
      #      (0, 3, 6, 2, 5, 1, 4), spreading them around the ring;
      #   4. the other channels follow it on each LED as a fixed fraction of
      #      it — the colour's own mix after the 2.8 gamma — so only the
      #      brightness moves, never the hue. Scaled and rounded on their own,
      #      a weak channel (one step of red in a yellow-green) stays lit on
      #      some LEDs while the strong one dims, and the exhale blinks red.
      #      Rounding the fraction per LED still moves the hue by up to half
      #      a step at the trough: ~7 % of the mix at a 7-step trough, but
      #      17-50 % at 1-3 steps, where an LED has next to no in-between
      #      shades. So a breath whose trough is under 7 steps (levels 1-6)
      #      takes the nearest colour that keeps its hue at every step: a
      #      channel at least half the strongest one's output counts as full,
      #      a weaker one as off. On the SK6812SIDE-A (datasheet mid-bin
      #      R 345 / G 930 mcd) that is also about where the hue is halfway
      #      (CIE u'v'), so AQI up to 89 breathes green, 90-121 yellow,
      #      122-200 red (above 200 the critical-air alert takes over). The
      #      shades in between show in AQI Solid, or in the breath from
      #      level 7 up.
      # The values are written through an identity correction, i.e. as final
      # LED outputs.
      - addressable_lambda:
          name: "AQI Breathing"
          update_interval: 30ms
          lambda: |-
            const int N = it.size();
            const Color col = id(oas_aqi_rgb);
            const uint8_t cv[3] = {col.r, col.g, col.b};
            int dom = 0;                           // the colour's strongest channel
            for (int ch = 1; ch < 3; ch++)
              if (cv[ch] > cv[dom]) dom = ch;
            it[0] = col;
            const uint8_t pk[3] = {it[0].get_red_raw(), it[0].get_green_raw(), it[0].get_blue_raw()};
            const float peak = (float) pk[dom];

            float k = 1.0f;                        // LED output relative to the peak
            const float lo = std::max(1.0f, 0.20f * peak);
            if (peak > lo) {
              const float s = 0.5f - 0.5f * cosf(6.2831853f * (float) (millis() % 4000) / 4000.0f);
              const float p_lo = powf(lo / peak, 1.0f / 2.8f);
              k = powf(p_lo + (1.0f - p_lo) * s, 2.8f);
            }

            static light::ESPColorCorrection raw = [] {
              light::ESPColorCorrection c;         // identity: no gamma, cap or brightness
              c.set_gamma_table(nullptr);
              c.set_max_brightness(Color(255, 255, 255, 255));
              c.set_local_brightness(255);
              return c;
            }();
            float share[3];                        // each channel's output as a share of the strongest
            for (int ch = 0; ch < 3; ch++) {
              share[ch] = cv[dom] ? powf((float) cv[ch] / (float) cv[dom], 2.8f) : 0.0f;
              if (lo < 7.0f) share[ch] = share[ch] >= 0.5f ? 1.0f : 0.0f;
            }
            const float v = peak * k;
            const int base = (int) floorf(v);
            const int extra = (int) lroundf((v - (float) base) * N);
            for (int r = 0; r < N; r++) {          // N = 7: gcd(3, 7) = 1, every LED once
              const int d = std::min(255, base + (r < extra ? 1 : 0));
              auto px = it[(r * 3) % N];
              px.raw_set_color_correction(&raw);
              px.set_rgb((uint8_t) lroundf(d * share[0]), (uint8_t) lroundf(d * share[1]),
                         (uint8_t) lroundf(d * share[2]));
            }

      # ---------------------------------------------------------------
      # AQI Solid — the AQI colour, steady (the whole ring one zone).
      # ---------------------------------------------------------------
      - addressable_lambda:
          name: "AQI Solid"
          update_interval: 200ms
          lambda: |-
            const Color c = id(oas_aqi_rgb);
            for (int i = 0; i < it.size(); i++) it[i] = c;

      # ---------------------------------------------------------------
      # Dot Chase — single bright white head rotating around the ring
      # with a 3-LED linearly-fading tail. ~3 s per rotation.
      # ---------------------------------------------------------------
      - addressable_lambda:
          name: "Dot Chase"
          update_interval: 80ms
          lambda: |-
            static uint32_t frame = 0;
            const int N = it.size();
            int head = (frame / 3) % N;
            frame++;

            for (int i = 0; i < N; i++) {
              int dist = head - i;
              while (dist < 0) dist += N;
              if      (dist == 0) it[i] = Color(255, 255, 255);
              else if (dist == 1) it[i] = Color(160, 160, 160);
              else if (dist == 2) it[i] = Color( 80,  80,  80);
              else if (dist == 3) it[i] = Color( 30,  30,  30);
              else                it[i] = Color(  0,   0,   0);
            }

      # ---------------------------------------------------------------
      # Solid — the light's own colour, no animation. Not a Ring Mode:
      # only the critical-air alert uses it (solid red).
      # ---------------------------------------------------------------
      - lambda:
          name: "Solid"
          update_interval: 1s
          lambda: |-
            // Intentionally empty — the alert sets the colour on the light.

# ---------------------------------------------------------------------------
# 1. Ring on/off  +  4. Night mode on/off
# ---------------------------------------------------------------------------
# Plain state holders (no turn_on/turn_off actions, so the boot-time state
# restore cannot call into anything — see the issue-#4 note in bt-proxy.yaml);
# the schedule tick reads them. "Ring" is the user's switch: at night
# brightness 0 the ring goes dark while the switch stays on.
switch:
  - platform: template
    id: oas_ring_on
    name: "Ring"
    icon: "mdi:led-strip-variant"
    web_server:
      sorting_group_id: grp_ring
      sorting_weight: 10
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_state:
      - lambda: 'if (id(oas_ring_ready)) id(oas_ring_changed) = true;'

  - platform: template
    id: oas_ring_night_mode
    name: "Ring Night Mode"
    icon: "mdi:weather-night"
    web_server:
      sorting_group_id: grp_ring
      sorting_weight: 40
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_state:
      - lambda: 'if (id(oas_ring_ready)) id(oas_ring_changed) = true;'

# ---------------------------------------------------------------------------
# 2. Ring Mode
# ---------------------------------------------------------------------------
# Options are the light's effect names, applied by name.
select:
  - platform: template
    id: oas_ring_mode
    name: "Ring Mode"
    icon: "mdi:palette"
    web_server:
      sorting_group_id: grp_ring
      sorting_weight: 20
    entity_category: config
    optimistic: true
    restore_value: true
    options:
      - "AQI Breathing"
      - "AQI Solid"
      - "Dot Chase"
    initial_option: "AQI Breathing"
    on_value:
      - lambda: 'if (id(oas_ring_ready)) id(oas_ring_changed) = true;'

# ---------------------------------------------------------------------------
# 3. Ring Brightness  +  5. Ring Night Brightness
# ---------------------------------------------------------------------------
# The night brightness can't exceed the day one; the tick snaps it back (it
# is not done here: a set_value from inside the number's own on_value would
# be overwritten in flash by the value the user sent).
number:
  - platform: template
    id: oas_ring_brightness
    name: "Ring Brightness"
    icon: "mdi:brightness-6"
    web_server:
      sorting_group_id: grp_ring
      sorting_weight: 30
    entity_category: config
    optimistic: true
    restore_value: yes
    initial_value: 4
    min_value: 1
    max_value: 10
    step: 1
    mode: SLIDER
    on_value:
      - lambda: 'if (id(oas_ring_ready)) id(oas_ring_changed) = true;'

  - platform: template
    id: oas_ring_night_brightness
    name: "Ring Night Brightness"
    icon: "mdi:brightness-4"
    web_server:
      sorting_group_id: grp_ring
      sorting_weight: 50
    entity_category: config
    optimistic: true
    restore_value: yes
    initial_value: 1
    min_value: 0
    max_value: 10
    step: 1
    mode: SLIDER
    on_value:
      - lambda: 'if (id(oas_ring_ready)) id(oas_ring_changed) = true;'

# ---------------------------------------------------------------------------
# 6. Night window
# ---------------------------------------------------------------------------
datetime:
  - platform: template
    type: time
    id: oas_ring_night_start
    name: "Ring Night Start"
    icon: "mdi:weather-sunset-down"
    web_server:
      sorting_group_id: grp_ring
      sorting_weight: 60
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: "22:00:00"
    on_value:
      - lambda: 'if (id(oas_ring_ready)) id(oas_ring_changed) = true;'

  - platform: template
    type: time
    id: oas_ring_night_end
    name: "Ring Night End"
    icon: "mdi:weather-sunset-up"
    web_server:
      sorting_group_id: grp_ring
      sorting_weight: 70
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: "07:00:00"
    on_value:
      - lambda: 'if (id(oas_ring_ready)) id(oas_ring_changed) = true;'

# ---------------------------------------------------------------------------
# Status line — what the ring is doing now, and until when
# ---------------------------------------------------------------------------
# Dashboard only: `internal` keeps it out of Home Assistant (it is not a
# control), and core.yaml's `web_server: include_internal: true` still shows
# it in the LED ring card.
text_sensor:
  - platform: template
    id: oas_ring_status
    name: "Ring Status"
    icon: "mdi:information-outline"
    internal: true
    web_server:
      sorting_group_id: grp_ring
      sorting_weight: 80
    update_interval: never    # published by the schedule tick below

# ---------------------------------------------------------------------------
# Critical-alert mirror
# ---------------------------------------------------------------------------
# Mirrors `oas_air_quality_critical` (packages/air-quality.yaml) under the
# name the LED UX talks about; the schedule tick below reads it.
binary_sensor:
  - platform: template
    id: oas_critical_alert
    name: "Critical Alert"
    web_server:
      sorting_group_id: grp_air
      sorting_weight: 120
    device_class: safety
    lambda: |-
      // NaN-safe: the upstream sensor's own lambda already guards NaN inputs.
      return id(oas_air_quality_critical).state;

# ---------------------------------------------------------------------------
# AQI colour + the schedule tick
# ---------------------------------------------------------------------------
interval:
  # AQI (0..500) -> colour, US-EPA-aligned bands with linear interpolation
  # between band edges. The AQI itself updates every 30 s.
  - interval: 5s
    then:
      - lambda: |-
          float aqi = id(oas_aqi_value).state;
          if (std::isnan(aqi) || aqi < 0.0f) aqi = 0.0f;   // no reading yet -> green
          if (aqi > 500.0f) aqi = 500.0f;

          // (upper-edge AQI, R, G, B)
          //   0.. 50 green, 51..100 yellow, 101..150 orange,
          // 151..200 red, 201..300 purple, 301..500 maroon
          struct Stop { float a; uint8_t r, g, b; };
          static const Stop stops[] = {
            {   0.0f,   0, 255,   0},
            {  50.0f,   0, 255,   0},
            { 100.0f, 255, 255,   0},
            { 150.0f, 255, 128,   0},
            { 200.0f, 255,   0,   0},
            { 300.0f, 160,   0, 200},
            { 500.0f, 130,   0,  30},
          };
          const int n = sizeof(stops) / sizeof(stops[0]);
          Color c(stops[n - 1].r, stops[n - 1].g, stops[n - 1].b);
          for (int i = 1; i < n; i++) {
            if (aqi <= stops[i].a) {
              const float t = (aqi - stops[i - 1].a) / (stops[i].a - stops[i - 1].a);
              c = Color((uint8_t) (stops[i - 1].r + t * (stops[i].r - stops[i - 1].r)),
                        (uint8_t) (stops[i - 1].g + t * (stops[i].g - stops[i - 1].g)),
                        (uint8_t) (stops[i - 1].b + t * (stops[i].b - stops[i - 1].b)));
              break;
            }
          }
          id(oas_aqi_rgb) = c;

  # The schedule: the only writer of the (internal) light. Each tick works out
  # what the ring should show from the settings, the clock and the critical-
  # air flag, changes the light where it differs, and publishes Ring Status.
  # Settings apply with a 0.5 s fade, the day/night switch with a 5 s one.
  - interval: 1s
    then:
      - lambda: |-
          if (!id(oas_ring_ready)) return;
          // Light brightness (0..255) of level 1..10 ([0] = off): the top of
          // the brightness band that gives the level's LED output (1, 2, 3, 5,
          // 10, 19, 36, 69, 133, 255 of 255) through ESPHome's gamma-2.8 table.
          // Level 4 = 64 = the old slider's 25 %, the temperature-calibration
          // setting (air-quality.yaml) — keep it when retuning the table.
          static const uint8_t LB[11] = {0, 40, 48, 55, 64, 81, 101, 127, 160, 202, 255};
          auto *ring = id(oas_ring);
          auto level_of = [](float v, int lo, int hi, int dflt) -> int {
            return std::isnan(v) ? dflt : std::max(lo, std::min(hi, (int) lroundf(v)));
          };
          const int day = level_of(id(oas_ring_brightness).state, 1, 10, 4);
          int night = level_of(id(oas_ring_night_brightness).state, 0, 10, 1);
          if (night > day) {                    // 0..Ring Brightness: snap back
            night = day;
            auto call = id(oas_ring_night_brightness).make_call();
            call.set_value(day);
            call.perform();
          }
          const bool fast = id(oas_ring_changed);
          id(oas_ring_changed) = false;
          const int ns = id(oas_ring_night_start).hour * 60 + id(oas_ring_night_start).minute;
          const int ne = id(oas_ring_night_end).hour * 60 + id(oas_ring_night_end).minute;

          // --- Inside the night window? (last known answer until the clock syncs)
          auto now = id(ha_time).now();
          const bool clock_ok = now.is_valid();
          if (clock_ok) {
            const int m = now.hour * 60 + now.minute;
            bool in_window;
            if (ns == ne)     in_window = false;                   // no night window
            else if (ns < ne) in_window = (m >= ns && m < ne);     // e.g. 01:00-06:00
            else              in_window = (m >= ns || m < ne);     // e.g. 22:00-07:00
            id(oas_ring_period) = in_window ? 1 : 0;
          }
          const bool night_mode = id(oas_ring_night_mode).state && ns != ne;
          const bool night_now = night_mode && id(oas_ring_period) == 1;
          const int level = night_now ? night : day;
          const bool alert = id(oas_critical_alert).state;

          // --- What the ring should show.
          const bool want_on = id(oas_ring_on).state && level > 0;
          const int want_lb = LB[(alert && !night_now) ? std::max(level, 7) : level];
          uint32_t want_fx;
          if (alert) {
            want_fx = ring->get_effect_index(std::string("Solid"));
          } else {
            auto idx = id(oas_ring_mode).active_index();
            want_fx = ring->get_effect_index(std::string(id(oas_ring_mode).option_at(idx.has_value() ? *idx : 0)));
          }

          // --- Change the light where it differs.
          const uint32_t fade = fast ? 500 : 5000;
          const auto &rv = ring->remote_values;
          if (!want_on) {
            if (rv.is_on()) {
              auto call = ring->turn_off();
              call.set_transition_length(fade);
              call.perform();
            }
          } else {
            auto call = ring->make_call();
            bool dirty = false, fx_set = false;
            const bool was_on = rv.is_on();
            if (!was_on) {
              call.set_state(true);
              dirty = true;
            }
            if (ring->get_current_effect_index() != want_fx) {  // also after every off: off drops the effect
              call.set_effect(want_fx);
              fx_set = dirty = true;
            }
            if (alert && !(rv.get_red() > 0.99f && rv.get_green() < 0.01f && rv.get_blue() < 0.01f)) {
              call.set_rgb(1.0f, 0.0f, 0.0f);
              dirty = true;
            }
            if (!was_on || (int) lroundf(rv.get_brightness() * 255.0f) != want_lb) {
              call.set_brightness(want_lb / 255.0f);
              if (was_on && !fx_set) call.set_transition_length(fade);  // an effect start can't fade
              dirty = true;
            }
            if (dirty) call.perform();
          }

          // --- Ring Status.
          char t_start[8], t_end[8], buf[80];
          snprintf(t_start, sizeof(t_start), "%02d:%02d", ns / 60, ns % 60);
          snprintf(t_end, sizeof(t_end), "%02d:%02d", ne / 60, ne % 60);
          if (!id(oas_ring_on).state) {
            snprintf(buf, sizeof(buf), "Off");
          } else if (level == 0) {
            snprintf(buf, sizeof(buf), "Off for the night, back on at %s", t_end);
          } else if (alert) {
            snprintf(buf, sizeof(buf), "Critical air quality alert: solid red");
          } else if (!night_mode) {
            snprintf(buf, sizeof(buf), "Brightness %d all day (%s)", day,
                     id(oas_ring_night_mode).state ? "night start = night end" : "night mode off");
          } else if (!clock_ok) {
            snprintf(buf, sizeof(buf), "Brightness %d, waiting for the clock to sync", level);
          } else if (night_now) {
            snprintf(buf, sizeof(buf), "Night, brightness %d until %s, then %d", night, t_end, day);
          } else if (night == 0) {
            snprintf(buf, sizeof(buf), "Day, brightness %d until %s, then off for the night", day, t_start);
          } else {
            snprintf(buf, sizeof(buf), "Day, brightness %d until %s, then %d", day, t_start, night);
          }
          if (id(oas_ring_status).state != buf) id(oas_ring_status).publish_state(buf);
