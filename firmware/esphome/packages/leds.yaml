# ---------------------------------------------------------------------------
# OAS LED ring controller — 7 x SK6812-SIDE side-emit RGB
# ---------------------------------------------------------------------------
# Hardware: 7 LEDs (D11..D18, D13 SKIPPED for the J1 24 V terminal block)
# on a Ø26 mm base pitch ring around the central cable hole. Side-emit toward
# the AK-N-94 perforated white ABS cover -> diffuse halo, no "dot-through-
# perforation" pattern.
#
# Bus     : 1-wire WS281x family, GPIO 8 (ESP32-C6 RMT peripheral)
# Variant : SK6812 (NOT WS2812 — different bit-timing; rgb_order GRB)
# Rail    : +5 V from LM2596S-5.0 buck
# Power   : 7 x 50 mA peak = 350 mA at full white; brightness cap below
#           keeps the bus draw comfortable for the LM2596 and prevents the
#           cover from blowing out perceptually at night.
#
# Control surface: ONE dropdown — the light's native "Effect" picker. The
# four effects are:
#   1. Dot Chase     — boot loading indicator (default until SEN66 data ready)
#   2. AQI Solid     — AQI gradient colour, static (default once data arrives)
#   3. AQI Breathing — AQI gradient colour with a ~4 s breathing envelope
#   4. Solid         — plain user-set colour (use the colour picker), no anim.
# "Off" = the light's on/off toggle. (There is deliberately no separate
# "ring mode" select — it duplicated the native effect dropdown.)
#
# Cross-package contract:
#   - packages/air-quality.yaml owns `oas_aqi_value` (template sensor, float),
#     `oas_co2` (raw SEN66 sensor) and `oas_air_quality_critical`. DO NOT
#     redeclare any of them here.
#   - This package owns `oas_ring` (the light entity) plus brightness /
#     night-mode / critical-override UI entities.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Globals
# ---------------------------------------------------------------------------
# `oas_critical_active` latches the critical-alert override so the auto-dim
# interval and boot logic know "do not touch the ring while alerting".
# `oas_pre_critical_effect` remembers the effect that was active before the
# override flipped the ring to red, so it can be restored when the alert clears.
# `oas_boot_phase` drives the boot loading indicator: 0 = not started,
# 1 = Dot Chase shown (waiting for first SEN66 reading), 2 = data arrived /
# AQI Solid applied.
globals:
  - id: oas_critical_active
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: oas_pre_critical_effect
    type: std::string
    restore_value: no
    initial_value: '"AQI Solid"'

  - id: oas_boot_phase
    type: int
    restore_value: no
    initial_value: '0'

# ---------------------------------------------------------------------------
# Light platform — the ring itself
# ---------------------------------------------------------------------------
light:
  - platform: esp32_rmt_led_strip
    chipset: SK6812
    rgb_order: GRB
    num_leds: 7
    pin: GPIO8
    rmt_symbols: 64
    id: oas_ring
    name: "OAS Ring"
    restore_mode: ALWAYS_OFF
    default_transition_length: 500ms
    effects:
      # ---------------------------------------------------------------
      # 1. Dot Chase — single bright white head rotating around the ring
      #    with a 3-LED linearly-fading tail. ~3 s per rotation. Used as
      #    the boot "loading" indicator until the SEN66 produces data.
      # ---------------------------------------------------------------
      - addressable_lambda:
          name: "Dot Chase"
          update_interval: 80ms
          lambda: |-
            static uint32_t frame = 0;
            const int N = it.size();
            int head = (frame / 3) % N;
            frame++;

            for (int i = 0; i < N; i++) {
              int dist = head - i;
              while (dist < 0) dist += N;
              if      (dist == 0) it[i] = Color(255, 255, 255);
              else if (dist == 1) it[i] = Color(160, 160, 160);
              else if (dist == 2) it[i] = Color( 80,  80,  80);
              else if (dist == 3) it[i] = Color( 30,  30,  30);
              else                it[i] = Color(  0,   0,   0);
            }

      # ---------------------------------------------------------------
      # 2. AQI Solid — addressable lambda. Maps oas_aqi_value (0..500)
      #    to a colour using the US-EPA-aligned bands, with linear
      #    interpolation between band edges for smooth transitions. All
      #    pixels share the colour — the ring reads as a single zone.
      # ---------------------------------------------------------------
      - addressable_lambda:
          name: "AQI Solid"
          update_interval: 200ms
          lambda: |-
            // Pull current AQI; guard NaN before air-quality.yaml has data.
            float aqi = id(oas_aqi_value).state;
            if (isnan(aqi) || aqi < 0.0f) aqi = 0.0f;
            if (aqi > 500.0f) aqi = 500.0f;

            // Band table — (upper-edge AQI, R, G, B).
            //   0.. 50 -> green  (  0, 255,   0)
            //  51..100 -> yellow (255, 255,   0)
            // 101..150 -> orange (255, 128,   0)
            // 151..200 -> red    (255,   0,   0)
            // 201..300 -> purple (160,   0, 200)
            // 301..500 -> maroon (130,   0,  30)
            struct Stop { float a; uint8_t r, g, b; };
            static const Stop stops[] = {
              {   0.0f,   0, 255,   0},
              {  50.0f,   0, 255,   0},
              { 100.0f, 255, 255,   0},
              { 150.0f, 255, 128,   0},
              { 200.0f, 255,   0,   0},
              { 300.0f, 160,   0, 200},
              { 500.0f, 130,   0,  30},
            };
            const int N = sizeof(stops) / sizeof(stops[0]);

            // Find the bracketing pair and lerp.
            uint8_t r = stops[N - 1].r;
            uint8_t g = stops[N - 1].g;
            uint8_t b = stops[N - 1].b;
            for (int i = 1; i < N; i++) {
              if (aqi <= stops[i].a) {
                float t = (aqi - stops[i - 1].a) /
                          (stops[i].a - stops[i - 1].a);
                if (t < 0.0f) t = 0.0f;
                if (t > 1.0f) t = 1.0f;
                r = (uint8_t)(stops[i - 1].r + t * (stops[i].r - stops[i - 1].r));
                g = (uint8_t)(stops[i - 1].g + t * (stops[i].g - stops[i - 1].g));
                b = (uint8_t)(stops[i - 1].b + t * (stops[i].b - stops[i - 1].b));
                break;
              }
            }

            // Paint the whole ring uniformly.
            for (int i = 0; i < it.size(); i++) {
              it[i] = Color(r, g, b);
            }

      # ---------------------------------------------------------------
      # 3. AQI Breathing — same AQI gradient colour as AQI Solid, but the
      #    whole ring breathes with a ~4 s sinusoidal envelope between
      #    15 % and 100 % of the mapped colour. The user's max-brightness
      #    slider still caps absolute output (master brightness multiplies
      #    this per-pixel result).
      # ---------------------------------------------------------------
      - addressable_lambda:
          name: "AQI Breathing"
          update_interval: 50ms
          lambda: |-
            // --- AQI -> colour (identical band table to AQI Solid) -------
            float aqi = id(oas_aqi_value).state;
            if (isnan(aqi) || aqi < 0.0f) aqi = 0.0f;
            if (aqi > 500.0f) aqi = 500.0f;

            struct Stop { float a; uint8_t r, g, b; };
            static const Stop stops[] = {
              {   0.0f,   0, 255,   0},
              {  50.0f,   0, 255,   0},
              { 100.0f, 255, 255,   0},
              { 150.0f, 255, 128,   0},
              { 200.0f, 255,   0,   0},
              { 300.0f, 160,   0, 200},
              { 500.0f, 130,   0,  30},
            };
            const int N = sizeof(stops) / sizeof(stops[0]);

            float r = stops[N - 1].r;
            float g = stops[N - 1].g;
            float b = stops[N - 1].b;
            for (int i = 1; i < N; i++) {
              if (aqi <= stops[i].a) {
                float t = (aqi - stops[i - 1].a) /
                          (stops[i].a - stops[i - 1].a);
                if (t < 0.0f) t = 0.0f;
                if (t > 1.0f) t = 1.0f;
                r = stops[i - 1].r + t * (stops[i].r - stops[i - 1].r);
                g = stops[i - 1].g + t * (stops[i].g - stops[i - 1].g);
                b = stops[i - 1].b + t * (stops[i].b - stops[i - 1].b);
                break;
              }
            }

            // --- Breathing envelope: 4 s period at 50 ms = 80 frames -----
            static uint32_t frame = 0;
            const float period = 80.0f;
            float phase = (float)(frame % (uint32_t)period) / period;  // 0..1
            frame++;
            // 0.5*(1 - cos) is a smooth 0->1->0 swell; floor at 0.15.
            float env = 0.15f + 0.85f *
                        (0.5f - 0.5f * cosf(2.0f * 3.14159265f * phase));

            uint8_t rr = (uint8_t)(r * env);
            uint8_t gg = (uint8_t)(g * env);
            uint8_t bb = (uint8_t)(b * env);
            for (int i = 0; i < it.size(); i++) {
              it[i] = Color(rr, gg, bb);
            }

      # ---------------------------------------------------------------
      # 4. Solid — no animation. The HA-side colour control sets the hue;
      #    this effect just turns animations OFF cleanly (used for a plain
      #    user colour and by the critical-alert red override).
      # ---------------------------------------------------------------
      - lambda:
          name: "Solid"
          update_interval: 1s
          lambda: |-
            // Intentionally empty — leave the current state untouched so
            // the user's (or the override's) chosen colour stays as set.

# ---------------------------------------------------------------------------
# Number entities — user-tunable brightness + night-mode schedule
# ---------------------------------------------------------------------------
number:
  # Max-brightness slider. The auto-dim interval below applies this value
  # scaled by the day/night factor; it is the ceiling the ring is driven to
  # during the day (the night window scales it down to 5 %).
  - platform: template
    id: oas_ring_brightness_max
    name: "OAS Ring Max Brightness"
    optimistic: true
    initial_value: 30
    min_value: 0
    max_value: 100
    step: 5
    restore_value: yes
    unit_of_measurement: "%"
    mode: SLIDER
    set_action:
      - lambda: |-
          auto call = id(oas_ring).turn_on();
          call.set_brightness(x / 100.0f);
          call.perform();

  # Night-mode window — when the local hour is inside [start, end)
  # (wrapping through midnight if end < start), the auto-dim interval
  # scales the ring to 5 % of the user's max-brightness setting.
  - platform: template
    id: oas_night_start
    name: "OAS Night Mode Start Hour"
    optimistic: true
    initial_value: 22
    min_value: 0
    max_value: 23
    step: 1
    restore_value: yes
    mode: BOX

  - platform: template
    id: oas_night_end
    name: "OAS Night Mode End Hour"
    optimistic: true
    initial_value: 7
    min_value: 0
    max_value: 23
    step: 1
    restore_value: yes
    mode: BOX

# ---------------------------------------------------------------------------
# Critical-alert override
# ---------------------------------------------------------------------------
# `oas_critical_alert` mirrors the air-quality-derived `oas_air_quality_critical`
# (defined in packages/air-quality.yaml), re-exposed here under the name the LED
# UX talks about. On assert it forces the ring to solid bright red (80 %,
# overriding the max-brightness cap); on clear it restores the effect that was
# active beforehand (falling back to AQI Solid).
binary_sensor:
  - platform: template
    id: oas_critical_alert
    name: "OAS Critical Alert"
    device_class: safety
    lambda: |-
      // Mirror air-quality.yaml's critical sensor. NaN-safe because the
      // upstream sensor's own lambda already guards NaN inputs.
      return id(oas_air_quality_critical).state;
    on_state:
      - if:
          condition:
            lambda: 'return x;'
          then:
            # Latch override -> solid red, remembering the current effect.
            - lambda: |-
                id(oas_pre_critical_effect) = id(oas_ring).get_effect_name();
                id(oas_critical_active) = true;
                auto call = id(oas_ring).turn_on();
                call.set_rgb(1.0f, 0.0f, 0.0f);
                call.set_brightness(0.80f);     // 80 % — overrides max cap
                call.set_effect("Solid");
                call.perform();
          else:
            # Clear override -> restore the previous effect (sane fallback).
            - lambda: |-
                id(oas_critical_active) = false;
                std::string eff = id(oas_pre_critical_effect);
                if (eff.empty() || eff == "None" || eff == "Solid" ||
                    eff == "Dot Chase") {
                  eff = "AQI Solid";
                }
                auto call = id(oas_ring).turn_on();
                call.set_effect(eff);
                call.set_brightness(id(oas_ring_brightness_max).state / 100.0f);
                call.perform();

# ---------------------------------------------------------------------------
# Boot loading indicator + auto-dim
# ---------------------------------------------------------------------------
interval:
  # Fast tick that drives the boot "loading" animation. On the first tick it
  # starts Dot Chase; once the SEN66 publishes its first reading (oas_co2 stops
  # being NaN) it switches the ring to AQI Solid (the default operating effect).
  # After that it is a cheap no-op (single int compare).
  - interval: 250ms
    then:
      - lambda: |-
          if (id(oas_boot_phase) == 0) {
            // Start the loading indicator.
            auto call = id(oas_ring).turn_on();
            call.set_effect("Dot Chase");
            call.set_brightness(id(oas_ring_brightness_max).state / 100.0f);
            call.perform();
            id(oas_boot_phase) = 1;
          } else if (id(oas_boot_phase) == 1 && !isnan(id(oas_co2).state)) {
            // First real SEN66 data -> default to AQI Solid.
            id(oas_boot_phase) = 2;
            if (!id(oas_critical_active)) {
              auto call = id(oas_ring).turn_on();
              call.set_effect("AQI Solid");
              call.set_brightness(id(oas_ring_brightness_max).state / 100.0f);
              call.perform();
            }
          }

  # Auto-dim — runs every minute; applies day/night brightness scaling.
  # `ha_time` is declared in packages/core.yaml. Skipped while a critical alert
  # is latched (the override owns brightness) and during the boot loading phase
  # (so it doesn't fight the Dot Chase indicator).
  - interval: 60s
    then:
      - lambda: |-
          if (id(oas_critical_active)) return;     // override owns brightness
          if (id(oas_boot_phase) < 2) return;      // still loading
          if (!id(oas_ring).remote_values.is_on()) return;

          auto now = id(ha_time).now();
          if (!now.is_valid()) return;

          int h = now.hour;
          int s = (int) id(oas_night_start).state;
          int e = (int) id(oas_night_end).state;
          bool night;
          if (s == e) {
            night = false;                          // window disabled
          } else if (s < e) {
            night = (h >= s) && (h < e);            // same-day window
          } else {
            night = (h >= s) || (h < e);            // wraps midnight
          }

          float max_pct = id(oas_ring_brightness_max).state / 100.0f;
          float br = night ? (max_pct * 0.05f) : max_pct;

          auto call = id(oas_ring).turn_on();
          call.set_brightness(br);
          call.set_transition_length(2000);         // 2 s smooth fade
          call.perform();
