# =============================================================================
# OAS — presence package (HLK-LD2410C mmWave radar)
# =============================================================================
#
# HiLink HLK-LD2410C 24 GHz FMCW mmWave human-presence radar daughterboard,
# seated on the OAS PCB via J4 (1x5 P2.54 mm gold-pin header), body flat
# above the board with its antenna face UP toward the perforated cover.
#
# Datasheet: HLK-LD2410C manual V1.00. See EXTERNAL_MODULES['HLK-LD2410C']
# in hardware/kicad/boardgen/_project.py for the part metadata.
#
# ---------------------------------------------------------------------------
# Pin order on the LD2410C module. Read with the antenna face toward you and
# the pin row at the top, pins run left to right (CLAUDE.md Lesson 20 — this
# is the MIRROR of the LD2410B order the board carried before issue #9, so
# never carry the old table over):
#   Pin 1 = UART_Tx   (LD2410 -> ESP32 RX)
#   Pin 2 = UART_Rx   (ESP32 TX -> LD2410)
#   Pin 3 = OUT       (digital presence, 3.3 V, active HIGH idle LOW)
#   Pin 4 = GND
#   Pin 5 = VCC       (+5 V from LM2596S buck, ~79 mA typical, >200 mA capable)
#
# ESP32-C6 wiring (CLAUDE.md pinout table):
#   GPIO 1  (UART1 TX, ESP32 -> LD2410 pin 2)
#   GPIO 0  (UART1 RX, ESP32 <- LD2410 pin 1)
#   GPIO 2  (binary input, ESP32 <- LD2410 pin 3, OUT)
#
# The UART pair used to sit on GPIO 16/17. It moved because those are
# U0TXD/U0RXD and the ESP32-C6-DevKitM-1 hard-wires them, through populated
# 0 R links, to its onboard CP2102N USB-UART bridge — a bridge powered from
# the board's 3.3 V rail, not from USB VBUS, so it drives the GPIO 17 net
# whenever the unit is on, with no cable attached. Two push-pull outputs on
# the radar's Tx net. See CLAUDE.md Lesson 23. GPIO 0/1 are free, adjacent
# pads on the socket row nearest J4; their XTAL_32K alternate function is
# irrelevant here (the DevKitM-1's 32.768 kHz crystal parts are all DNP).
#
# ---------------------------------------------------------------------------
# LD2410 gate concept
# ---------------------------------------------------------------------------
# The radar internally divides its 0..6 m detection range into 9 gates of
# 0.75 m each (gate 0 = 0..0.75 m, gate 1 = 0.75..1.5 m, ... gate 8 =
# 6..6.75 m). Each gate has independently configurable sensitivity for
# both "moving" and "still" detection (0..100, lower = more sensitive).
# Detection happens when the in-gate energy exceeds the gate sensitivity
# threshold. The "max distance" gate limits how far the radar reports
# targets; "timeout" is how long a target keeps registering after it
# stops moving.
#
# After first deployment in a room, tune per-gate thresholds via the
# "G<n> Move/Still Threshold" number entities below (sliders in the ESPHome
# web_server and in Home Assistant) or via the HLKRadarTools Android/iOS app
# over BLE (the LD2410C's own Bluetooth stack is independent of the UART;
# press "LD2410 Read Params" afterwards so the entities re-sync).
#
# ---------------------------------------------------------------------------
# Baud rate note
# ---------------------------------------------------------------------------
# The LD2410C default UART speed is 256000 baud — non-standard but supported
# natively by the ESP32-C6 hardware UART controller (the C6 UART clock
# divider can land on 256000 with <0.5 % error from the 80 MHz APB clock,
# well within UART tolerance). No software UART needed, no special config
# required beyond setting baud_rate: 256000. Confirmed by the official
# ESPHome ld2410 component docs and by community ESP32-C6 + LD2410 builds
# in 2025-2026.
# =============================================================================

# ---------------------------------------------------------------------------
# UART bus dedicated to the LD2410. Cannot share with anything else.
# ---------------------------------------------------------------------------
uart:
  - id: ld2410_uart
    # Pin mapping comes from the ${ld2410_tx_pin} / ${ld2410_rx_pin}
    # substitutions declared in oas.yaml (defaults GPIO1 / GPIO0 — the
    # current schematic). v0.51 boards must override to GPIO16 / GPIO17.
    tx_pin: ${ld2410_tx_pin}
    rx_pin: ${ld2410_rx_pin}
    baud_rate: 256000
    # parity NONE, data_bits 8, stop_bits 1 are the defaults — match the
    # LD2410 8N1 protocol spec.
    parity: NONE
    stop_bits: 1
    data_bits: 8

# ---------------------------------------------------------------------------
# LD2410 component — the protocol parser and command-issuer.
# ---------------------------------------------------------------------------
ld2410:
  uart_id: ld2410_uart
  # Throttle note: the LD2410 streams detection frames at ~10 Hz by default.
  # Without rate-limiting each frame would re-publish every sensor entity; in
  # HA that floods the recorder DB. The component-level `throttle:` option was
  # removed in ESPHome 2026.x ("use per-sensor filters, instead"), so the
  # 500 ms rate-limit now lives as a `throttle` filter on each numeric ld2410
  # sensor below (sensor: platform: ld2410). The binary_sensors and the OUT-pin
  # GPIO binary_sensor are deliberately NOT throttled, so instant on/off
  # automations can still subscribe to those.

# ---------------------------------------------------------------------------
# Binary sensors
# ---------------------------------------------------------------------------
binary_sensor:
  # UART-derived presence (filtered through the LD2410's internal logic).
  # Slightly slower than the OUT pin (one UART frame of latency) but
  # incorporates the gate-sensitivity tuning below.
  - platform: ld2410
    has_target:
      name: "Presence"
      id: oas_presence
      device_class: occupancy
    has_moving_target:
      name: "Moving Target"
      id: oas_moving_target
      device_class: motion
    has_still_target:
      name: "Still Target"
      id: oas_still_target
      device_class: occupancy

  # Hardware OUT pin (J4 pin 3 -> GPIO 2). This is the fastest path to a
  # presence signal: the LD2410 asserts OUT high within ~50 ms of target
  # acquisition, no UART parsing involved. Use this as the authoritative
  # source for instant-response automations (e.g. lights-on); use the
  # UART has_target above for occupancy reporting with sensitivity gates.
  #
  # Pin is push-pull from the LD2410 (3.3 V), idle LOW, active HIGH per
  # datasheet §5.1. Configure as plain INPUT — no pull resistor needed
  # since the LD2410 actively drives both states.
  - platform: gpio
    name: "Presence Pin"
    id: oas_presence_pin
    pin:
      number: GPIO2
      mode:
        input: true
    device_class: occupancy

# ---------------------------------------------------------------------------
# Sensors — distance, energy, light.
# ---------------------------------------------------------------------------
sensor:
  - platform: ld2410
    moving_distance:
      name: "Moving Distance"
      id: oas_moving_distance
      filters:
        - throttle: 500ms
    still_distance:
      name: "Still Distance"
      id: oas_still_distance
      filters:
        - throttle: 500ms
    moving_energy:
      name: "Moving Energy"
      id: oas_moving_energy
      filters:
        - throttle: 500ms
    still_energy:
      name: "Still Energy"
      id: oas_still_energy
      filters:
        - throttle: 500ms
    detection_distance:
      name: "Detection Distance"
      id: oas_detection_distance
      filters:
        - throttle: 500ms

# ---------------------------------------------------------------------------
# Number entities — runtime-configurable detection parameters.
# ---------------------------------------------------------------------------
# Each appears as a slider in the ESPHome web_server and as a Number entity
# in Home Assistant. Tune per room after first deployment.
number:
  - platform: ld2410
    # Maximum gate (0..8) that registers MOVING targets. Default 8 (~6 m).
    # Reduce in small rooms to filter out detections beyond the wall.
    max_move_distance_gate:
      name: "Max Move Gate"
    # Same as above but for STILL targets (breathing-only humans).
    max_still_distance_gate:
      name: "Max Still Gate"
    # Seconds the target stays "present" after detection drops. Default 5 s.
    # Increase in offices where people sit still for long periods to avoid
    # the lights cutting out during deep concentration.
    timeout:
      name: "Presence Timeout"
    # Ambient-light threshold for the optional dependent-output gating
    # (only relevant if light_function below is set to anything other
    # than off). 0..255, 0 = always trigger regardless of light level.
    light_threshold:
      name: "Light Threshold"

    # Per-gate detection thresholds, 0..100. A gate registers a target when
    # its energy EXCEEDS the threshold, so 100 disables the gate. The radar
    # keeps these in its own flash: a value set once survives OAS reboots and
    # reflashes, and the entities below are read back from the module at boot
    # and after "LD2410 Read Params". Module factory defaults (gates 0..8):
    # move 50/50/40/30/20/15/15/15/15, still 0/0/40/40/30/30/20/20/20.
    #
    # Deployment finding (v0.54, first wall-mounted unit, 2026-09): on factory
    # defaults the unit reports a phantom moving target every few seconds,
    # always in gate 0 (reported distance ~30 cm) with moving energy 51-55
    # against the gate-0 default of 50. Nothing in the room moves; the return
    # comes from inside the enclosure (the SEN66 fan spins ~4 cm from the
    # antenna, the perforated cover sits ~10 mm in front of it). Gate 0 is the
    # first 0.75 m from the wall, so disabling it costs nothing: set "G0 Move
    # Threshold" to 100 on every unit after the first flash (the bring-up
    # script in firmware/tools does this). If gate 1 flaps as well, raise it
    # to ~70 before touching anything further out.
    g0:
      move_threshold:
        name: "G0 Move Threshold"
      still_threshold:
        name: "G0 Still Threshold"
    g1:
      move_threshold:
        name: "G1 Move Threshold"
      still_threshold:
        name: "G1 Still Threshold"
    g2:
      move_threshold:
        name: "G2 Move Threshold"
      still_threshold:
        name: "G2 Still Threshold"
    g3:
      move_threshold:
        name: "G3 Move Threshold"
      still_threshold:
        name: "G3 Still Threshold"
    g4:
      move_threshold:
        name: "G4 Move Threshold"
      still_threshold:
        name: "G4 Still Threshold"
    g5:
      move_threshold:
        name: "G5 Move Threshold"
      still_threshold:
        name: "G5 Still Threshold"
    g6:
      move_threshold:
        name: "G6 Move Threshold"
      still_threshold:
        name: "G6 Still Threshold"
    g7:
      move_threshold:
        name: "G7 Move Threshold"
      still_threshold:
        name: "G7 Still Threshold"
    g8:
      move_threshold:
        name: "G8 Move Threshold"
      still_threshold:
        name: "G8 Still Threshold"

# ---------------------------------------------------------------------------
# Buttons — service / maintenance actions.
# ---------------------------------------------------------------------------
button:
  - platform: ld2410
    # Resets the LD2410 to factory defaults. Wipes per-gate sensitivity
    # tuning. Use only when starting over from scratch.
    factory_reset:
      name: "LD2410 Factory Reset"
      entity_category: config
    # Soft-reboots the LD2410. Useful if it gets into a wedged state
    # (very rare; usually solved by power-cycle of the whole OAS unit).
    restart:
      name: "LD2410 Restart"
      entity_category: config
    # Re-reads the gate parameters from the LD2410 and republishes the
    # number entities above. Useful after changing sensitivity via the
    # HLKRadarTools Bluetooth app instead of via ESPHome.
    query_params:
      name: "LD2410 Read Params"
      entity_category: diagnostic

# ---------------------------------------------------------------------------
# Selects — multi-choice runtime config.
# ---------------------------------------------------------------------------
select:
  - platform: ld2410
    # 0.75 m (default, 9 gates over 0..6 m) or 0.2 m (33 gates over
    # 0..6.6 m, finer resolution). The fine mode needs module firmware
    # >= 1.07.16B; whether the fitted module accepts it is a property of
    # the module, not of the board, so confirm it on the unit rather than
    # assuming (the OAS board carries HLK-LD2410C as of issue #9, and
    # Hi-Link does not document the fine mode for that variant). Reduce to
    # 0.2 m for small rooms where 0.75 m gates over-quantize the space.
    distance_resolution:
      name: "Distance Resolution"
      entity_category: config
    # UART baud rate negotiation. Default 256000 matches the uart: block
    # above. Changing this on the fly will desync the ESP32 <-> LD2410
    # link; only useful if a future hardware revision changes baud.
    baud_rate:
      name: "LD2410 Baud Rate"
      entity_category: config

# ---------------------------------------------------------------------------
# Switches — runtime toggles.
# ---------------------------------------------------------------------------
switch:
  - platform: ld2410
    # The LD2410C's onboard BLE stack — independent from the OAS ESP32-C6's
    # BLE. Used by the HLKRadarTools phone app for sensitivity tuning.
    # Disable in production to avoid stray BLE advertisements once tuning
    # is complete (and to reduce 2.4 GHz noise for the OAS's own BLE proxy).
    bluetooth:
      name: "LD2410 Bluetooth"
      entity_category: config
    # Engineering mode reports per-gate energy readings on every UART
    # frame. Useful during sensitivity tuning; adds ~9x UART traffic and
    # is overkill for production. Keep OFF after calibration.
    engineering_mode:
      name: "LD2410 Engineering Mode"
      entity_category: diagnostic
