# =============================================================================
# OAS — air quality package
# =============================================================================
#
# Sensirion SEN66 (combo: PM 1/2.5/4/10, CO2, VOC index, NOx index, T, RH) over
# I2C from a PCB-mounted JST-GH socket (J3). SEN66 is the headline sensor and
# Pillar #1 (measurement quality) anchor — see CLAUDE.md v0.6 / v0.15.8 / v0.22
# entries for the architectural decisions behind this stack.
#
# Wiring (per CLAUDE.md "ESP32-C6-DevKitM-1-N4 pinout (v0.4 final)" table):
#   - I2C SDA = GPIO 6
#   - I2C SCL = GPIO 7
#   - bus frequency = 100 kHz (Sensirion standard mode — SEN66 datasheet §3.1
#     hard limit; the realized OAS bus length is ~220 mm including the 80 mm
#     JST-GH cable to the SEN66 module, which is marginal for 400 kHz fast
#     mode; do NOT bump frequency without a signal-integrity measurement)
#   - SEN66 address = 0x6B (7-bit, fixed)
#
# This package also declares the primary I2C bus (id: bus_a) since the SEN66
# is the heaviest user. Any future Qwiic expansion package should
# reference `bus_a` rather than declaring its own.
#
# Datasheet refs (see EXTERNAL_MODULES['SEN66-SIN-T'] in hardware/kicad/boardgen/_project.py):
#   - Sensirion SEN6x datasheet v0.92, Dec 2025
#   - Sensirion SEN6x mechanical / assembly guidelines v0.92, Jan 2026
#   - Sensirion SEN6x temperature-compensation app note v1.1, Jan 2026
# =============================================================================

# ---------------------------------------------------------------------------
# STAR-Engine design-in constants (Sensirion SEN6x tcomp app note v1.1, 01/2026)
# ---------------------------------------------------------------------------
# What the SEN66 needs in order to report ROOM temperature from inside the OAS
# enclosure. Values that differ per unit (offsets, time constants) are `number:`
# entities further down (NVS-persisted, defaults = the reference unit). Values
# that are a property of the DESIGN live here as substitutions, so a device
# file can still override them without touching the package.
substitutions:
  # Normalised offset slope, dimensionless: how much the self-heating
  # over-temperature changes per kelvin of module temperature (AN §1.4).
  # 0 = the "basic" recipe (AN §2.2): one temperature level, constant offset.
  #
  # TODO (winter, AN §2.3.2): the slope needs the steady-state offset at a
  # SECOND room temperature, ideally ~10 K away from the level the offset was
  # derived at (summer, room ~23 °C). No experiment needed: with the room
  # steady near 19 °C (no AC, no sun on the enclosure, ≥ 6 h, references next
  # to the unit) read the offset the same way as in summer (T_ref - T_module
  # averaged over the last hour). If it differs from the summer value by more
  # than the reference uncertainty (~0.2 K):
  #   slope = (offset_high - offset_low) / (T_module_high - T_module_low)
  # and set it here. The engine then applies offset(T) = C_0C + slope * T_module;
  # the send script converts the room-level "Temperature Offset" number into
  # C_0C with `sen66_star_slope_ref_c`, so the number keeps its room meaning.
  # Worked example: summer -3.4 at T_module 26.3, winter -3.6 at T_module 22.6
  #   -> slope = 0.2 / 3.7 = 0.054, C_0C = -3.6 - 22.6 * 0.054 = -4.82
  #   -> wire values slope 540 (×10000), offset -964 (×200).
  # The slope is applied to slot 0 only (the base self-heating); slot 1 keeps 0.
  sen66_star_slope: "0"
  # Module temperature (°C, as reported by the SEN66) at which the slot-0
  # "Temperature Offset" number was determined. Only used when the slope is
  # non-zero. Reference unit, summer: room 22.9 °C + 3.4 K over-temperature.
  sen66_star_slope_ref_c: "26.3"

# ---------------------------------------------------------------------------
# I2C bus (primary, shared with Qwiic)
# ---------------------------------------------------------------------------
i2c:
  - id: bus_a
    # Pin mapping comes from the ${i2c_sda_pin} / ${i2c_scl_pin}
    # substitutions declared in oas.yaml. DEFAULTS are the schematic mapping
    # (sda = GPIO6, scl = GPIO7) — correct for boards with the corrected J3
    # pinout (issue #6 / CLAUDE.md Lesson 21).
    #
    # HISTORY / WHY overrides exist: the v0.51 boards copied the SEN6x
    # datasheet Table 16 (v0.92, p. 15) MODULE-side pinout pin-for-pin onto
    # J3, but a straight flat JST GH lead mirrors pin positions between the
    # two face-to-face keyed connectors (position k mates position 7-k).
    # The SEN6x pinout is power-symmetric (pins 1/6 and 2/5 internally
    # tied), so the mirror shows up ONLY as an SDA<->SCL swap — the SEN66
    # was powered but never ACKed. On v0.51 boards the SEN66's SDA/SCL
    # therefore reach the OPPOSITE ESP GPIOs and firmware must swap the
    # pins (i2c_sda_pin: GPIO7 / i2c_scl_pin: GPIO6 — see
    # examples/v0.51-board.yaml). Bring-up (2026-06-30) confirmed the swap
    # makes the SEN66 ACK at 0x6B and report real readings with a straight
    # cable. Flashing the wrong mapping for the board revision leaves the
    # SEN66 dead either way — see HARDWARE-COMPAT-v0.51.md.
    #
    # NOTE: the mapping is bus-wide, so it also affects the J9 Qwiic port.
    # With the defaults (corrected board) J9 is a standard Qwiic port; with
    # the v0.51 override a standard Qwiic device needs a crossed cable.
    sda: ${i2c_sda_pin}
    scl: ${i2c_scl_pin}
    frequency: 100kHz   # SEN66 datasheet §3.1 max — DO NOT increase
    scan: true          # logs detected addresses at startup (0x6B SEN66, plus any Qwiic guest)

# ---------------------------------------------------------------------------
# Raw I2C device handle for the SEN66, used only for STAR-Engine writes
# ---------------------------------------------------------------------------
# The upstream `sensor.sen6x` component (ESPHome 2026.3.x) does NOT yet expose
# the SEN6x temperature-compensation API the way `sensor.sen5x` does — i.e.
# there is no `temperature_compensation:` / `acceleration_mode:` config block
# on the sen6x platform. The SEN6x application note v1.1 calls these parameters
# out as VOLATILE — they reset on every power cycle and MUST be re-uploaded by
# the host on each boot. Since the platform doesn't do this for us, we open a
# parallel i2c_device handle on the same bus + same address and issue the
# command sequence ourselves from `on_boot:` (priority 600, well after sensor
# init at priority 700 → device is reachable, sen6x measurement loop pauses
# briefly while we hold the bus).
#
# This handle is non-conflicting with the sen6x platform: i2c_device is a thin
# wrapper around the bus master, both end up arbitrating on the same internal
# bus mutex.
i2c_device:
  - id: sen66_raw
    i2c_id: bus_a
    address: 0x6B

# ---------------------------------------------------------------------------
# User-adjustable calibration values (persisted via NVS / flash)
# ---------------------------------------------------------------------------
# TEMPERATURE: the two "Temperature Offset" pairs below are NOT ESPHome-side
# filters. They are the SEN66 STAR-Engine offset slots (I2C 0x60B2, Sensirion
# SEN6x tcomp app note v1.1 §3.2), written into the module at every boot and
# whenever a value changes. The module subtracts them from its temperature AND
# recomputes relative humidity from the corrected temperature (AN §1.5: "the
# relative humidity output ... must not be compensated separately"). Values
# follow the Sensirion definition C_offset = T_reference - T_module in steady
# state, so a unit that reads warm gets a NEGATIVE offset.
#
#   slot 0 "Temperature Offset" / "Temperature Offset Tau": the enclosure
#     self-heating (regulators + ESP32-C6 + LD2410C behind the SEN66).
#     Offset = steady-state over-temperature vs two references next to the
#     unit; tau = warm-up time constant (AN §2.2.2: time from a COLD power-on
#     until the module temperature crosses 63 % of the final over-temperature).
#   slot 1 "Temperature Offset Slow" / "Temperature Offset Slow Tau": a second,
#     slower exponential seen on the reference unit (foam gasket + ABS
#     enclosure saturating over ~2 h). 0 K = slot disabled; filled in once the
#     cold-start experiment splits the warm-up into the two components.
#
# Defaults = the reference unit: AK-N-94, two-tunnel foam gasket on the SEN66,
# LED ring 25 %, BLE proxy on, radar Bluetooth off, two references 40 cm away
# (offset -3.4 K = mean of -3.2 vs an SCD41 monitor and -3.55 vs an SHT31
# logger, night steady state). Any change to the heat budget (ring brightness,
# BLE proxy, gasket, enclosure) shifts the offset; re-derive per AN §2.2.
# Slot-0 tau = 1800 s, from the cold-start run of 2026-09-09 (4.3 h off, cold
# power-on confirmed by the reset reason, both offsets zeroed for the recording).
# Only the first 13 minutes of that run are usable - an air conditioner started
# and ran for 45 minutes, which the Sensirion recipe excludes (forced convection
# changes how the enclosure sheds heat). In that clean window dT rose 0.09 ->
# 0.86 -> 1.30 K against a reference steady at 23.3 C, which fits tau ~ 25-30 min
# with an amplitude near the 3.4 K measured overnight. Slot 1 stays off: the run
# was too short to separate a slow second exponential from the fast one.
# The value only shapes the first tens of minutes after a COLD power-on (mains
# outage); every other reset takes the warm path with tau = 0. Re-measure with a
# clean 6 h cold start if that transient ever matters.
# Runtime changes from the UI are applied at once (tau = 0); the configured
# tau only matters after a cold power-on.
#
# HUMIDITY / CO2 offsets stay ESPHome-side `filter: - offset:` on the
# published value: Sensirion provides no RH offset command (RH is corrected
# through the temperature slots) and CO2 has its own FRC mechanism. Both
# default to 0 and are meant for residual site trims only.
number:
  - platform: template
    name: "Temperature Offset"
    web_server:
      sorting_group_id: grp_air_cfg
      sorting_weight: 10
    id: oas_temperature_offset
    icon: "mdi:thermometer-minus"
    unit_of_measurement: "°C"
    min_value: -10.0
    max_value: 10.0
    step: 0.05
    initial_value: -3.4
    restore_value: true
    optimistic: true
    mode: box
    entity_category: config
    on_value:
      - script.execute:
          id: sen66_star_send_offsets
          immediate: true
          reason: "runtime change, tau=0"

  - platform: template
    name: "Temperature Offset Tau"
    web_server:
      sorting_group_id: grp_air_cfg
      sorting_weight: 20
    id: oas_temperature_offset_tau
    icon: "mdi:timer-sand"
    unit_of_measurement: "s"
    min_value: 0
    max_value: 36000
    step: 10
    initial_value: 1800
    restore_value: true
    optimistic: true
    mode: box
    entity_category: config
    on_value:
      - script.execute:
          id: sen66_star_send_offsets
          immediate: true
          reason: "runtime change, tau=0"

  - platform: template
    name: "Temperature Offset Slow"
    web_server:
      sorting_group_id: grp_air_cfg
      sorting_weight: 30
    id: oas_temperature_offset_slow
    icon: "mdi:thermometer-minus"
    unit_of_measurement: "°C"
    min_value: -5.0
    max_value: 5.0
    step: 0.05
    initial_value: 0.0
    restore_value: true
    optimistic: true
    mode: box
    entity_category: config
    on_value:
      - script.execute:
          id: sen66_star_send_offsets
          immediate: true
          reason: "runtime change, tau=0"

  - platform: template
    name: "Temperature Offset Slow Tau"
    web_server:
      sorting_group_id: grp_air_cfg
      sorting_weight: 40
    id: oas_temperature_offset_slow_tau
    icon: "mdi:timer-sand"
    unit_of_measurement: "s"
    min_value: 0
    max_value: 36000
    step: 60
    initial_value: 7200
    restore_value: true
    optimistic: true
    mode: box
    entity_category: config
    on_value:
      - script.execute:
          id: sen66_star_send_offsets
          immediate: true
          reason: "runtime change, tau=0"

  - platform: template
    name: "Humidity Offset"
    web_server:
      sorting_group_id: grp_air_cfg
      sorting_weight: 50
    id: oas_humidity_offset
    icon: "mdi:water-percent-alert"
    unit_of_measurement: "%"
    min_value: -20.0
    max_value: 20.0
    step: 0.5
    initial_value: 0.0
    restore_value: true
    optimistic: true
    mode: box
    entity_category: config

  - platform: template
    name: "CO2 Offset"
    web_server:
      sorting_group_id: grp_air_cfg
      sorting_weight: 60
    id: oas_co2_offset
    icon: "mdi:molecule-co2"
    unit_of_measurement: "ppm"
    min_value: -100
    max_value: 100
    step: 1
    initial_value: 0
    restore_value: true
    optimistic: true
    mode: box
    entity_category: config

# ---------------------------------------------------------------------------
# SEN66 sensor platform
# ---------------------------------------------------------------------------
# update_interval: 30s is the Sensirion-recommended pacing for SEN66 — the
# sensor samples internally at 1 Hz, runs PM optical bench + CO2 NDIR + VOC/NOx
# MOX + SHT measurement cycles, and exposes the 5 s averaged values. 30 s
# matches the conservative "give the algorithm a stable window" cadence and
# keeps WiFi air-time low for fleet deployments.
#
# Each channel:
#   - force_update: true → ESPHome republishes even if the value didn't change
#     (Home Assistant statistics + long-term storage benefit from regular
#     timestamps; AQI calc downstream wants a heartbeat)
#   - accuracy_decimals: matches Sensirion datasheet typical resolution
#   - state_class / device_class: standard Home Assistant taxonomy so the value
#     lands in the right energy/environment dashboard pane automatically
#   - filter (where applied): user offset from the number entities above
sensor:
  - platform: sen6x
    type: SEN66
    i2c_id: bus_a
    address: 0x6B
    update_interval: 30s

    pm_1_0:
      name: "PM 1.0"
      web_server:
        sorting_group_id: grp_air
        sorting_weight: 30
      id: oas_pm_1_0
      device_class: pm1
      state_class: measurement
      accuracy_decimals: 1
      force_update: true

    pm_2_5:
      name: "PM 2.5"
      web_server:
        sorting_group_id: grp_air
        sorting_weight: 40
      id: oas_pm_2_5
      device_class: pm25
      state_class: measurement
      accuracy_decimals: 1
      force_update: true

    pm_4_0:
      name: "PM 4.0"
      web_server:
        sorting_group_id: grp_air
        sorting_weight: 50
      id: oas_pm_4_0
      state_class: measurement
      accuracy_decimals: 1
      force_update: true
      # No HA device_class for PM 4.0 — Sensirion-specific channel.

    pm_10_0:
      name: "PM 10"
      web_server:
        sorting_group_id: grp_air
        sorting_weight: 60
      id: oas_pm_10_0
      device_class: pm10
      state_class: measurement
      accuracy_decimals: 1
      force_update: true

    co2:
      name: "CO2"
      web_server:
        sorting_group_id: grp_air
        sorting_weight: 20
      id: oas_co2
      device_class: carbon_dioxide
      state_class: measurement
      accuracy_decimals: 0
      force_update: true
      filters:
        - offset: !lambda 'return id(oas_co2_offset).state;'

    voc:
      name: "VOC Index"
      web_server:
        sorting_group_id: grp_air
        sorting_weight: 70
      id: oas_voc
      icon: "mdi:air-filter"
      state_class: measurement
      accuracy_decimals: 0
      force_update: true
      # VOC index is unitless Sensirion 1..500 scale (100 = typical indoor).

    nox:
      name: "NOx Index"
      web_server:
        sorting_group_id: grp_air
        sorting_weight: 80
      id: oas_nox
      icon: "mdi:smog"
      state_class: measurement
      accuracy_decimals: 0
      force_update: true
      # NOx index is unitless Sensirion 1..500 scale (1 = typical indoor).

    temperature:
      name: "Temperature"
      web_server:
        sorting_group_id: grp_air
        sorting_weight: 90
      id: oas_temperature
      device_class: temperature
      state_class: measurement
      unit_of_measurement: "°C"
      accuracy_decimals: 1
      force_update: true
      # No ESPHome-side offset here: the design-in compensation runs INSIDE
      # the SEN66 (STAR-Engine offset slots, see the number entities and the
      # boot sequence at the end of this file), so this is the module's
      # compensated output exactly as Sensirion intends, and RH follows it.

    humidity:
      name: "Humidity"
      web_server:
        sorting_group_id: grp_air
        sorting_weight: 100
      id: oas_humidity
      device_class: humidity
      state_class: measurement
      unit_of_measurement: "%"
      accuracy_decimals: 1
      force_update: true
      filters:
        - offset: !lambda 'return id(oas_humidity_offset).state;'

  # -------------------------------------------------------------------------
  # AQI value — combined PM2.5 (US EPA breakpoints) + CO2 comfort index
  # -------------------------------------------------------------------------
  # Two-input air-quality index optimized for the OAS LED-ring mapping in
  # packages/leds.yaml. The ring needs ONE scalar [0..500] to colour-map.
  #
  # PM2.5 → AQI (US EPA, Title 40 CFR Part 58 Appendix G, 2024 revision):
  #   PM2.5 (µg/m³)   | AQI range  | Category
  #   ----------------+------------+-------------------
  #     0.0 .. 12.0   |   0 ..  50 | Good
  #    12.1 .. 35.4   |  51 .. 100 | Moderate
  #    35.5 .. 55.4   | 101 .. 150 | Unhealthy SG
  #    55.5 ..150.4   | 151 .. 200 | Unhealthy
  #   150.5 ..250.4   | 201 .. 300 | Very Unhealthy
  #   250.5 ..500.0   | 301 .. 500 | Hazardous
  #
  # CO2 → comfort index (custom, scaled to AQI range so max() is meaningful):
  #   CO2 (ppm)       | Comfort | Equiv. AQI
  #   ----------------+---------+-----------
  #      0 ..  800    |   5/5   |   0..50    excellent (fresh outdoor air ≈ 420 ppm)
  #    800 .. 1000    |   4/5   |  51..100   good
  #   1000 .. 1500    |   3/5   | 101..200   moderate
  #   1500 .. 2000    |   2/5   | 201..300   poor (drowsy / concentration loss)
  #    2000+          |   1/5   | 301..500   bad (ventilation required)
  #
  # The published value is max(pm25_aqi, co2_aqi) so the worse of the two
  # axes drives the LED colour. This matches the "rooms with a heater on
  # often have low PM but climbing CO2" use case.
  - platform: template
    name: "Air Quality Index"
    web_server:
      sorting_group_id: grp_air
      sorting_weight: 10
    id: oas_aqi_value
    icon: "mdi:air-filter"
    unit_of_measurement: "AQI"
    accuracy_decimals: 0
    state_class: measurement
    update_interval: 30s
    lambda: |-
      // Guard against initial NaN before SEN66 first measurement.
      float pm25 = id(oas_pm_2_5).state;
      float co2 = id(oas_co2).state;
      if (isnan(pm25)) pm25 = 0.0f;
      if (isnan(co2)) co2 = 0.0f;

      // --- PM2.5 → AQI piecewise linear (EPA 2024) -----------------------
      auto pm25_aqi = [](float c) -> float {
        struct B { float clo, chi, alo, ahi; };
        static const B band[] = {
          {  0.0f,  12.0f,   0.0f,  50.0f},
          { 12.1f,  35.4f,  51.0f, 100.0f},
          { 35.5f,  55.4f, 101.0f, 150.0f},
          { 55.5f, 150.4f, 151.0f, 200.0f},
          {150.5f, 250.4f, 201.0f, 300.0f},
          {250.5f, 500.0f, 301.0f, 500.0f},
        };
        if (c < 0.0f) return 0.0f;
        for (auto &b : band) {
          if (c <= b.chi) {
            return b.alo + (b.ahi - b.alo) * (c - b.clo) / (b.chi - b.clo);
          }
        }
        return 500.0f;  // off-scale Hazardous
      };

      // --- CO2 → comfort-equiv AQI piecewise linear ---------------------
      auto co2_aqi = [](float c) -> float {
        if (c <=  800.0f) return  0.0f + ( 50.0f -   0.0f) * (c -    0.0f) / ( 800.0f -    0.0f);
        if (c <= 1000.0f) return 51.0f + (100.0f -  51.0f) * (c -  800.1f) / (1000.0f -  800.1f);
        if (c <= 1500.0f) return 101.0f + (200.0f - 101.0f) * (c - 1000.1f) / (1500.0f - 1000.1f);
        if (c <= 2000.0f) return 201.0f + (300.0f - 201.0f) * (c - 1500.1f) / (2000.0f - 1500.1f);
        if (c <= 5000.0f) return 301.0f + (500.0f - 301.0f) * (c - 2000.1f) / (5000.0f - 2000.1f);
        return 500.0f;
      };

      float a = pm25_aqi(pm25);
      float b = co2_aqi(co2);
      return (a > b) ? a : b;

# ---------------------------------------------------------------------------
# Critical-alert flag — referenced by packages/leds.yaml for the red blink
# ---------------------------------------------------------------------------
# Trips when EITHER axis crosses an unambiguously unhealthy threshold:
#   - AQI > 200  (PM2.5 path: "Unhealthy" or worse)
#   - CO2 > 1500 ppm (cognitive-impairment threshold)
# Hysteresis is enforced in the LED package's `on_press` / `on_release`
# triggers so the LED doesn't flicker around the boundary.
binary_sensor:
  - platform: template
    name: "Air Quality Critical"
    web_server:
      sorting_group_id: grp_air
      sorting_weight: 110
    id: oas_air_quality_critical
    device_class: safety
    lambda: |-
      float aqi = id(oas_aqi_value).state;
      float co2 = id(oas_co2).state;
      if (isnan(aqi)) aqi = 0.0f;
      if (isnan(co2)) co2 = 0.0f;
      return (aqi > 200.0f) || (co2 > 1500.0f);

# ---------------------------------------------------------------------------
# STAR-Engine plumbing: state, reset-reason source, offset-slot writer
# ---------------------------------------------------------------------------
# Sensirion I2C wire format: [cmd_hi][cmd_lo] then per 16-bit word
# [data_hi][data_lo][crc8(data_hi, data_lo)]; CRC-8 poly 0x31, init 0xFF
# (datasheet §4.7). Why raw I2C: ESPHome's sen6x component (through 2026.8,
# dev branch checked 2026-09-09) has no `temperature_compensation:` block like
# sen5x has. When it lands upstream, the script and the boot sequence below
# can be replaced by it.
globals:
  - id: oas_star_boot_done      # set by the boot sequence; gates runtime re-sends
    type: bool
    initial_value: "false"
  - id: oas_star_warm           # reset reason says the enclosure is still warm
    type: bool
    initial_value: "false"
  - id: oas_star_err            # bit0 stop, bit1 accel, bit2 start, bit3 slot0, bit4 slot1
    type: int
    initial_value: "0"

# Reset reason (ESP32 ROM / IDF) as a text sensor: "power-on event" = cold
# enclosure, anything else (software / OTA restart, watchdogs, panic, brownout)
# = still warm. Useful on its own in Home Assistant diagnostics.
debug:
  update_interval: 5min   # its heap / loop logs are DEBUG level; logger runs at INFO

text_sensor:
  - platform: debug
    reset_reason:
      name: "Reset Reason"
      web_server:
        sorting_group_id: grp_system
        sorting_weight: 30
      id: oas_reset_reason
      icon: "mdi:restart-alert"
      entity_category: diagnostic

  # Updated by the boot sequence and by every offset-slot write. There is NO
  # read-back command for 0x6100 / 0x60B2 (datasheet §4.8 command table), so
  # this reports what was SENT and the I2C result. Verify behaviour against a
  # reference thermometer, not this text.
  - platform: template
    name: "STAR-Engine State"
    web_server:
      sorting_group_id: grp_air_cfg
      sorting_weight: 70
    id: oas_star_engine_state
    icon: "mdi:tune-vertical"
    entity_category: diagnostic
    update_interval: never   # only updated explicitly from lambdas

# Writes STAR-Engine offset slots 0 and 1 (I2C 0x60B2, AN §3.2 Table 3) from
# the number entities. `immediate: true` applies the values with time constant
# 0 (warm start, runtime change from the UI); `false` ramps them in with the
# configured tau (cold power-on, mimicking the enclosure warming up). The
# command is accepted in idle and measurement mode and ADDS to the module's
# own factory self-heating compensation.
script:
  - id: sen66_star_send_offsets
    mode: queued
    parameters:
      immediate: bool
      reason: string
    then:
      - lambda: |-
          if (!id(oas_star_boot_done)) {
            return;   // on_value fired by the NVS restore before the module was ready
          }
          auto crc8 = [](uint8_t a, uint8_t b) -> uint8_t {
            uint8_t c = 0xFF;
            for (uint8_t x : {a, b}) {
              c ^= x;
              for (int i = 0; i < 8; i++) c = (c & 0x80) ? (uint8_t)((c << 1) ^ 0x31) : (uint8_t)(c << 1);
            }
            return c;
          };
          auto put = [&](uint8_t *p, uint16_t v) {
            p[0] = (uint8_t)(v >> 8); p[1] = (uint8_t)(v & 0xFF); p[2] = crc8(p[0], p[1]);
          };
          const float slope = ${sen66_star_slope};         // design constant, see substitutions
          const float t_ref = ${sen66_star_slope_ref_c};
          struct Slot { uint16_t slot; float offset_c; float tau_s; };
          const Slot slots[2] = {
            {0, id(oas_temperature_offset).state,      id(oas_temperature_offset_tau).state},
            {1, id(oas_temperature_offset_slow).state, id(oas_temperature_offset_slow_tau).state},
          };
          int errs = 0;
          for (const auto &sl : slots) {
            const float sl_slope = (sl.slot == 0) ? slope : 0.0f;
            // AN §2.3.2: with a non-zero slope the engine expects the offset at 0 °C
            const float c0 = sl.offset_c - (sl_slope != 0.0f ? t_ref * sl_slope : 0.0f);
            const int16_t  w_off   = (int16_t) roundf(c0 * 200.0f);         // ×200
            const int16_t  w_slope = (int16_t) roundf(sl_slope * 10000.0f); // ×10000
            const uint16_t w_tau   = immediate ? 0 : (uint16_t) roundf(sl.tau_s);
            uint8_t buf[2 + 4 * 3] = {0x60, 0xB2};
            put(buf + 2,  (uint16_t) w_off);
            put(buf + 5,  (uint16_t) w_slope);
            put(buf + 8,  w_tau);
            put(buf + 11, sl.slot);
            auto err = id(sen66_raw).write(buf, sizeof(buf));
            ESP_LOGI("sen66", "STAR offset slot %u: %.2f C (wire %d), slope %.4f, tau %u s: err=%d",
                     sl.slot, sl.offset_c, (int) w_off, sl_slope, (unsigned) w_tau, (int) err);
            if (err != esphome::i2c::ErrorCode::ERROR_OK) errs |= (8 << sl.slot);
          }
          id(oas_star_err) = (id(oas_star_err) & 0x07) | errs;
          const int e = id(oas_star_err);
          char txt[200];
          if (e == 0) {
            snprintf(txt, sizeof(txt),
                     "uploaded: accel Light in idle; slot0 %.2f C / %.0f s; slot1 %.2f C / %.0f s; %s",
                     slots[0].offset_c, slots[0].tau_s, slots[1].offset_c, slots[1].tau_s, reason.c_str());
          } else {
            snprintf(txt, sizeof(txt), "FAILED (stop=%d accel=%d start=%d slot0=%d slot1=%d) - check I2C bus",
                     e & 1, (e >> 1) & 1, (e >> 2) & 1, (e >> 3) & 1, (e >> 4) & 1);
          }
          id(oas_star_engine_state).publish_state(txt);

# ---------------------------------------------------------------------------
# Boot-time STAR-Engine upload (acceleration, then offset slots)
# ---------------------------------------------------------------------------
# Everything the STAR-Engine is told is VOLATILE (datasheet §4.8.14 / §4.8.15)
# and the sen6x component resets the module on every ESP boot, so both
# commands are re-sent here. Order per AN §2: "always determine and fix the
# acceleration parameters first" - 0x6100 acceleration, then 0x60B2 offsets.
#
# 0x6100 (acceleration, "Light / IAQM" preset from AN Table 1) is accepted in
# IDLE mode only. The sen6x component has already started the measurement by
# the time on_boot automations run, so the sequence is: Stop Measurement
# (0x0104, then ≥ 1400 ms) → 0x6100 → Start Continuous Measurement (0x0021).
# Safe on SEN66: the datasheet's "do not stop the sensor" caveat concerns the
# CO2-1 error of SEN63C / SEN69C, and the component ignores readings for the
# first 60 s anyway, so the 1.5 s gap is never published. An earlier revision
# sent 0x6100 in measurement mode; the module ACKed and silently ignored it.
#
#   Display values   → I2C raw (×10)   → 0x6100 payload (single 4-word write)
#     K  = 20        →  K  =  200        word 0
#     P  = 20        →  P  =  200        word 1
#     T1 = 100 s     →  T1 = 1000        word 2
#     T2 = 300 s     →  T2 = 3000        word 3
#   (Sensirion driver `sen66_i2c.c::sen66_set_temperature_acceleration_parameters`.)
#
# Cold vs warm start (AN §2.4.2): after a power-on reset the enclosure is
# cold, so the offset slots ramp in with their time constants; after any other
# reset (OTA, software restart, watchdog, brownout, panic) the enclosure is
# still warm, so they are applied at once (tau = 0). Known gap: a short mains
# outage is a power-on reset on a warm enclosure → the reading is too high by
# up to the offset for about one tau, then correct.
#
# NOTE: on_boot is written as a LIST on purpose — packages/presence.yaml adds its
# own boot hook, and ESPHome's package merge only concatenates lists (a dict
# here would be silently replaced by the later package's list).
esphome:
  on_boot:
      # Priority 600 = the sen6x setup level. The component's reset → start
      # chain runs from the scheduler within ~300 ms of the main loop starting;
      # the 5 s delay puts this sequence well after it (the old 2 s worked too).
    - priority: 600
      then:
        - delay: 5s
        - lambda: |-
            // 0x0104 Stop Measurement → idle (0x6100 is idle-only)
            const uint8_t cmd[2] = {0x01, 0x04};
            auto err = id(sen66_raw).write(cmd, 2);
            ESP_LOGI("sen66", "STAR: stop measurement for the idle-only 0x6100: err=%d", (int) err);
            id(oas_star_err) = (err == esphome::i2c::ErrorCode::ERROR_OK) ? 0 : 1;
        - delay: 1500ms   # datasheet §4.8.2: wait ≥ 1400 ms after Stop
        - lambda: |-
            // 0x6100 Set Temperature Acceleration Parameters (idle mode only)
            auto crc8 = [](uint8_t a, uint8_t b) -> uint8_t {
              uint8_t c = 0xFF;
              for (uint8_t x : {a, b}) {
                c ^= x;
                for (int i = 0; i < 8; i++) c = (c & 0x80) ? (uint8_t)((c << 1) ^ 0x31) : (uint8_t)(c << 1);
              }
              return c;
            };
            uint8_t buf[2 + 4 * 3] = {0x61, 0x00};
            const uint16_t w[4] = {200, 200, 1000, 3000};   // K, P, T1, T2 (×10)
            for (int i = 0; i < 4; i++) {
              buf[2 + i * 3] = (uint8_t)(w[i] >> 8);
              buf[3 + i * 3] = (uint8_t)(w[i] & 0xFF);
              buf[4 + i * 3] = crc8(buf[2 + i * 3], buf[3 + i * 3]);
            }
            auto err = id(sen66_raw).write(buf, sizeof(buf));
            ESP_LOGI("sen66", "STAR accel (K=200, P=200, T1=1000, T2=3000) in idle: err=%d", (int) err);
            if (err != esphome::i2c::ErrorCode::ERROR_OK) id(oas_star_err) |= 2;
        - delay: 50ms     # 0x6100 execution time 20 ms
        - lambda: |-
            // 0x0021 Start Continuous Measurement
            const uint8_t cmd[2] = {0x00, 0x21};
            auto err = id(sen66_raw).write(cmd, 2);
            ESP_LOGI("sen66", "STAR: measurement restarted: err=%d", (int) err);
            if (err != esphome::i2c::ErrorCode::ERROR_OK) id(oas_star_err) |= 4;
        - delay: 100ms    # start execution time 50 ms
        - lambda: |-
            const std::string &r = id(oas_reset_reason).state;
            // empty = text sensor not published yet: assume cold (Sensirion's default)
            id(oas_star_warm) = !(r.empty() || r == "power-on event" || r == "unknown source");
            ESP_LOGI("sen66", "STAR: reset reason '%s' -> %s start", r.c_str(), id(oas_star_warm) ? "warm" : "cold");
            id(oas_star_boot_done) = true;
        - script.execute:
            id: sen66_star_send_offsets
            immediate: !lambda 'return id(oas_star_warm);'
            reason: !lambda 'return id(oas_star_warm) ? std::string("warm start, tau=0") : std::string("cold start, ramping with tau");'
