# =============================================================================
# OAS — physical push-button (SW1)
# =============================================================================
#
# SW1 is a side-actuated tactile push-button mounted at the AK-N-94 USB-C
# case-wall opening, wired to ESP32-C6 GPIO 1 (button -> GND, internal
# pull-up; pressed = LOW, so the pin is read inverted).
#
#   short press  -> cycle the LED ring brightness  25 -> 50 -> 75 -> 100 -> Off
#   long press   -> restart the ESP32-C6
#
# The brightness steps drive `oas_ring_brightness_max` (owned by leds.yaml),
# whose set_action turns the ring on at the new level; the Off step turns the
# ring off. The button is a local manual override and does not touch the
# `oas_ring_mode` select.
# =============================================================================

globals:
  # Button brightness-cycle index: 0..3 = 25/50/75/100 %, 4 = Off.
  # restore_value so the ring returns to the last level across a reboot.
  - id: oas_btn_level
    type: int
    restore_value: yes
    initial_value: '4'

script:
  # Advance the brightness cycle one step and apply it.
  - id: oas_button_cycle
    then:
      - lambda: |-
          int lvl = id(oas_btn_level) + 1;
          if (lvl > 4) lvl = 0;
          id(oas_btn_level) = lvl;
      - if:
          condition:
            lambda: 'return id(oas_btn_level) == 4;'
          then:
            # Off step — turn the ring off.
            - light.turn_off: oas_ring
          else:
            # Brightness step — number.set drives oas_ring_brightness_max,
            # whose set_action turns the ring on at the new level.
            - number.set:
                id: oas_ring_brightness_max
                value: !lambda |-
                  const int pct[4] = {25, 50, 75, 100};
                  return pct[id(oas_btn_level)];

binary_sensor:
  - platform: gpio
    id: oas_button
    name: "${friendly_name} Button"
    pin:
      # ESP32-C6 GPIO 1 — safe non-strap input. Button to GND, internal
      # pull-up; inverted so a press reads as ON.
      number: GPIO1
      inverted: true
      mode:
        input: true
        pullup: true
    filters:
      - delayed_on: 20ms
      - delayed_off: 20ms
    on_click:
      # Short press — cycle the LED ring brightness.
      - min_length: 50ms
        max_length: 900ms
        then:
          - script.execute: oas_button_cycle
      # Long press (~2 s) — restart the ESP32-C6.
      - min_length: 1500ms
        max_length: 10000ms
        then:
          - logger.log: "SW1 long press — restarting"
          - lambda: 'App.safe_reboot();'
