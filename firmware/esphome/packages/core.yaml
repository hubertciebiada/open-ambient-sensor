# =============================================================================
# OAS — core services package
# =============================================================================
#
# Shared infrastructure used by every OAS unit regardless of which sensors
# or peripherals are populated:
#   - WiFi + AP fallback + captive portal
#   - First-flash Improv-over-Serial provisioning
#   - Home Assistant native API
#   - OTA update transport
#   - On-device web dashboard (web_server v3)
#   - Logger (USB-only — HW UART pins are owned by LD2410)
#   - mDNS (so devices are reachable as oas-<device_id>.local)
#   - SNTP + Home Assistant time sources
#   - Prometheus metrics endpoint (optional — useful for fleet monitoring)
#
# Per-device substitutions (device_id, friendly_name) are inherited from
# the top-level oas.yaml.
# =============================================================================

# ---------------------------------------------------------------------------
# WiFi
# ---------------------------------------------------------------------------
# fast_connect: true skips the full scan and reconnects to the last known BSSID
# straight after boot — keeps SEN66 first-measurement latency down.
# Observed on the v0.54 bring-up (2026-09, controller-managed multi-AP
# network): the first association attempt after boot fails whatever this
# option says — with `true` the saved-BSSID attempt gets "Authentication
# Failed", with `false` the first scan does not even list the SSID and the
# first auth after the second scan fails too ("Probe Request Unsuccessful" /
# "Authentication Failed"). Either way ESPHome's retry phases connect 10–15 s
# after boot. The failures are on the AP side, so the option is left at the
# value that at least saves the scan on a single-AP network.
# power_save_mode: light lets the C6 use WiFi 6 TWT (Target Wake Time) for
# longer DTIM intervals; reduces avg current ~30% vs power_save_mode: none.
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  power_save_mode: light

  # AP fallback — comes up if the configured WiFi is unreachable, lets the
  # user re-provision credentials via captive portal without re-flashing.
  ap:
    ssid: "OAS-${device_id}-Setup"
    password: !secret ap_password

# Captive portal on the AP fallback interface — opens a config page
# automatically when a phone joins the OAS-<id>-Setup SSID.
captive_portal:

# ---------------------------------------------------------------------------
# First-time provisioning over USB
# ---------------------------------------------------------------------------
# improv_serial lets the user pair WiFi via USB before the device has any
# network credentials, using the Improv WiFi web app (https://www.improv-wifi.com/).
# Saves having to type credentials into secrets.yaml for first flash.
improv_serial:

# ---------------------------------------------------------------------------
# Home Assistant native API
# ---------------------------------------------------------------------------
api:
  encryption:
    key: !secret api_encryption_key
  # Reboot if the API hasn't been contacted in 15 min — recovers the device
  # from soft hangs without a power cycle. Slightly conservative; default
  # is 5 min but OAS deployments may be far from the HA instance.
  reboot_timeout: 15min

# ---------------------------------------------------------------------------
# Over-the-air updates
# ---------------------------------------------------------------------------
ota:
  - platform: esphome
    password: !secret ota_password

# ---------------------------------------------------------------------------
# On-device web dashboard
# ---------------------------------------------------------------------------
# Available at http://oas-<device_id>.local/ or http://<device-ip>/. The v3
# UI is the modern (post-2024) ESPHome dashboard with light controls,
# number entity sliders for sensor offset tuning, live log viewer, and
# live sensor readouts — fully usable without Home Assistant.
#
# ota: false because the canonical OTA transport is the api/ota above
# (encrypted, password-protected). The web_server's bundled OTA endpoint
# is older and less secure; disabling it keeps the surface tighter.
web_server:
  port: 80
  version: 3
  ota: false
  log: true
  # Internal entities are not sent to Home Assistant; this shows them here
  # anyway. That is how a dashboard-only entity is made (Ring Status in
  # leds.yaml). An internal entity that should not clutter this page either
  # gets `disabled_by_default: true` - it then sits behind "Show All" (the
  # ring's own light entity does).
  include_internal: true
  # Dashboard layout: one card per sub-device, measurements split from the
  # settings that shape them, and everything that belongs to the ESP32 itself
  # (radio, uptime, service buttons) in its own card at the bottom. The
  # per-entity `web_server: {sorting_group_id, sorting_weight}` keys live next
  # to each entity in the package that owns it. Home Assistant ignores all of
  # this - it groups by `entity_category` instead.
  sorting_groups:
    - id: grp_air
      name: "Air quality"
      sorting_weight: 10
    - id: grp_air_cfg
      name: "Air quality - settings"
      sorting_weight: 20
    - id: grp_presence
      name: "Presence"
      sorting_weight: 30
    - id: grp_presence_cfg
      name: "Presence - settings"
      sorting_weight: 40
    - id: grp_ring
      name: "LED ring"
      sorting_weight: 50
    - id: grp_system
      name: "System"
      sorting_weight: 70

# ---------------------------------------------------------------------------
# Logger
# ---------------------------------------------------------------------------
# hardware_uart: USB_SERIAL_JTAG routes the logger over the ESP32-C6's native
# USB-Serial-JTAG controller instead of a hardware UART. Both ports work as a
# console — the DevKitM-1 has one USB-C on the native USB-Serial-JTAG (GPIO
# 12/13) and one on the CP2102N bridge (UART0, GPIO 16/17) — and since the
# LD2410 moved off GPIO 16/17 the CP2102N port is a usable console again
# (CLAUDE.md Lesson 23). Native USB stays the default anyway: it needs no
# board pins at all, it survives a re-pinning of UART0, and its port is the
# one that also carries USB-Serial-JTAG flashing. Routing the logger to USB
# also keeps improv_serial working (it needs a non-disabled serial logger;
# baud_rate: 0 would break it).
# Logs are available via:
#   - USB-Serial-JTAG (native USB) when plugged into the USB-C port
#   - The web_server's live log viewer
#   - Home Assistant device logs via the API
logger:
  level: INFO
  hardware_uart: USB_SERIAL_JTAG

# ---------------------------------------------------------------------------
# mDNS — makes the device discoverable as oas-<device_id>.local on the LAN.
# ---------------------------------------------------------------------------
mdns:
  disabled: false

# ---------------------------------------------------------------------------
# Time
# ---------------------------------------------------------------------------
# SNTP as primary so day/night LED dimming works even if HA is down.
# Home Assistant as secondary so the device's clock stays aligned with the
# HA system clock for log timestamps.
time:
  - platform: sntp
    id: sntp_time
  - platform: homeassistant
    id: ha_time

# ---------------------------------------------------------------------------
# Link and uptime diagnostics
# ---------------------------------------------------------------------------
# WiFi RSSI is the number the enclosure question turns on: the DevKitM-1's
# PCB antenna hangs over U1 / L1 (the buck section) and the unit lives behind
# a perforated ABS cover, so every deployment should log the RSSI on the
# bench and again in its final position. Uptime makes reboot loops visible
# from Home Assistant without a serial cable (api.reboot_timeout, safe_mode).
sensor:
  - platform: wifi_signal
    name: "WiFi RSSI"
    web_server:
      sorting_group_id: grp_system
      sorting_weight: 10
    id: oas_wifi_rssi
    update_interval: 60s
    entity_category: diagnostic
  - platform: uptime
    name: "Uptime"
    web_server:
      sorting_group_id: grp_system
      sorting_weight: 20
    id: oas_uptime
    entity_category: diagnostic

# ---------------------------------------------------------------------------
# Service buttons
# ---------------------------------------------------------------------------
# Restart re-runs every component's setup() without cutting the 24 V feed.
# The reason it exists: a component that fails at boot is marked FAILED and
# never retries (sen6x on a loose JST GH lead is the case that motivated
# this), so after reseating a cable the unit needs a reboot — and a
# wall-mounted unit has no reachable power switch.
#
# Safe mode reboots into an OTA-only state with every component disabled.
# It is the rescue path for a unit wedged by its own config (the v0.51
# bluetooth_proxy crash-loop, GitHub issue #4, was exactly that) — recovers
# it over the network instead of by demounting the enclosure.
#
# There is deliberately NO factory_reset button: it also wipes the WiFi
# credentials, dropping the unit to the AP fallback where it needs physical
# access. That is the opposite of what a wall-mounted fleet wants.
button:
  - platform: restart
    name: "Restart"
    web_server:
      sorting_group_id: grp_system
      sorting_weight: 50
    entity_category: config
  - platform: safe_mode
    name: "Restart (Safe Mode)"
    web_server:
      sorting_group_id: grp_system
      sorting_weight: 60
    entity_category: config

# ---------------------------------------------------------------------------
# Prometheus metrics endpoint
# ---------------------------------------------------------------------------
# Available at http://<device>/metrics. Useful if you scrape with
# Prometheus / Grafana alongside HA, or for fleet health monitoring.
# Negligible overhead when not scraped.
prometheus:
